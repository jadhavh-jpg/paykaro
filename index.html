<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayMoney – India’s Easy Payment Gateway</title>

<!-- Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<!-- Icons -->
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
:root{
  --blue:#0D3B66;
  --green:#2FB344;
  --border:#e5e7eb;
  --light:#F9FAFB;
}

*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:Inter,sans-serif;
  background:#fff;
  color:#111;
}

/* ================= HEADER ================= */
header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 18px;
}
.brand{
  display:flex;
  align-items:center;
  gap:10px;
}
.brand img{
  height:42px;
  display:block;
}
header span{
  font-size:14px;
  color:#555;
}

/* ================= LAYOUT ================= */
.container{
  max-width:1200px;
  margin:auto;
  padding:64px 18px;
}
h1,h2,h3{
  font-family:Poppins,sans-serif;
  font-weight:700;
}

/* ================= HERO ================= */
.hero{
  background:linear-gradient(135deg,#0D3B66,#1f7a52);
  color:#fff;
  border-radius:26px;
  overflow:hidden;
}
.hero-inner{
  display:flex;
  align-items:center;
  gap:40px;
}
.hero-text{flex:1}
.hero-text h1{
  font-size:44px;
  line-height:1.15;
  font-weight:800;
}
.hero-text p{
  margin:18px 0;
  font-size:18px;
  color:#eafff3;
}

.hero-buttons a{
  display:inline-block;
  padding:16px 32px;
  border-radius:14px;
  font-weight:800;           /* 🔥 STRONG */
  font-size:16px;
  text-decoration:none;
  margin-right:10px;
}
.btn-primary{
  background:#fff;
  color:var(--blue);
}
.btn-secondary{
  border:2px solid #fff;
  color:#fff;
}

/* ================= MOCKUPS ================= */
.hero-mockups{
  flex:1;
  display:flex;
  gap:16px;
  justify-content:flex-end;
}
.phone{
  width:150px;
  height:300px;
  background:#fff;
  border-radius:24px;
  box-shadow:0 18px 40px rgba(0,0,0,.25);
}

/* ================= SECTIONS ================= */
.steps,.features,.for{
  display:grid;
  gap:26px;
  margin-top:30px;
}
.steps,.features{
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
}
.for{
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
}
.step,.feature,.for div{
  border:1px solid var(--border);
  border-radius:18px;
  padding:26px;
  text-align:center;
  background:#fff;
}
.feature{
  font-weight:700;
}

/* ================= WHO IS IT FOR (ICONS BACK) ================= */
.for i{
  font-size:34px;
  color:var(--green);
  margin-bottom:12px;
  display:block;
}

/* ================= CTA ================= */
.cta{
  background:linear-gradient(135deg,#0D3B66,#1e5fa8);
  color:#fff;
  text-align:center;
  border-radius:26px;
}
.cta a{
  display:inline-block;
  margin-top:20px;
  padding:18px 36px;
  background:var(--green);
  color:#fff;
  border-radius:14px;
  font-weight:800;     /* 🔥 STRONG */
  text-decoration:none;
  font-size:16px;
}

/* ================= ABOUT ================= */
.about{
  background:var(--light);
  border-radius:22px;
}
.about p{
  max-width:900px;
  margin:auto;
  color:#444;
  font-size:16px;
  line-height:1.7;
  text-align:center;
}

/* ================= FOOTER ================= */
footer{
  background:#f1f5f9;
  padding:28px;
  text-align:center;
  font-size:14px;
}

/* ================= WHATSAPP FLOAT ================= */
.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
  width:56px;
  height:56px;
  background:#25D366;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  box-shadow:0 10px 25px rgba(0,0,0,.3);
  z-index:999;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  header{
    flex-direction:column;
    gap:6px;
  }
  .hero-inner{
    flex-direction:column;
    text-align:center;
  }
  .hero-buttons a{
    display:block;
    width:100%;
    margin:10px 0;
  }
  .hero-mockups{
    justify-content:center;
    overflow-x:auto;
    scroll-snap-type:x mandatory;
  }
  .phone{
    width:110px;
    height:220px;
    scroll-snap-align:center;
  }
}
</style>
</head>
