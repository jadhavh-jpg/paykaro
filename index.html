<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayMoney | Fast & Secure Payment Gateway for India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
:root{
  --blue:#0D3B66;
  --green:#2FB344;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#fff;color:#111}

/* ================= HEADER ================= */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
}
.logo img{height:72px}
header span{font-weight:600;color:#333}

/* ================= HERO ================= */
.hero{
  background:linear-gradient(135deg,#0D3B66,#1f7a52);
  border-radius:26px;
  color:#fff;
  overflow:hidden;
}
.hero-inner{
  display:flex;
  align-items:center;
  gap:60px;
  padding:70px 40px;
}

/* scroll reveal */
.hero-text,.hero-visual{
  opacity:0;
  transform:translateY(40px);
  transition:.9s ease;
}
.hero.show .hero-text,
.hero.show .hero-visual{
  opacity:1;
  transform:translateY(0);
}

.hero-text{flex:1}
.hero-text h1{
  font-size:44px;
  line-height:1.15;
}
.hero-text p{
  margin:18px 0;
  font-size:18px;
  color:#eafff3;
}

/* ================= BUTTONS ================= */
.btn{
  padding:16px 40px;
  border-radius:42px;
  font-weight:700;
  text-decoration:none;
  margin-right:14px;
  display:inline-block;
}
.btn-primary{
  background:#fff;
  color:#0D3B66;
}
.btn-secondary{
  border:2px solid rgba(255,255,255,.6);
  color:#fff;
}

/* ================= HERO IMAGE ================= */
.hero-visual{
  flex:1;
  position:relative;
  height:380px;            /* 🔥 BADA */
  display:flex;
  justify-content:flex-end;
}

/* glow background */
.hero-visual::before{
  content:"";
  position:absolute;
  inset:-70px;
  background:linear-gradient(120deg,#2FB344,#0ea5e9,#22c55e);
  filter:blur(110px);
  opacity:.35;
  animation:glow 10s linear infinite;
}
@keyframes glow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* slider frame (BIG & CLEAR) */
.phone-slider{
  width:640px;      /* 🔥 aur bada */
  height:360px;
  position:relative;
  overflow:hidden;
  border-radius:28px;
}

/* slide */
.phone-slide{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  border-radius:28px;
  box-shadow:0 20px 45px rgba(0,0,0,.35);
  opacity:0;
  animation:slideShow 16s infinite;
  transition:transform .6s ease;
}

/* ❌ NO BLUR – ONLY LIGHT GLASS SHINE */
.phone-slide::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    to bottom right,
    rgba(255,255,255,.08),
    rgba(255,255,255,.02)
  );
  border-radius:28px;
  pointer-events:none;
}

/* hover zoom */
.phone-slider:hover .phone-slide{
  transform:scale(1.05);
  animation-play-state:paused;
}

/* timing */
.phone-slide:nth-child(1){animation-delay:0s}
.phone-slide:nth-child(2){animation-delay:4s}
.phone-slide:nth-child(3){animation-delay:8s}
.phone-slide:nth-child(4){animation-delay:12s}

@keyframes slideShow{
  0%{opacity:0;transform:translateX(40px)}
  10%{opacity:1;transform:translateX(0)}
  25%{opacity:1}
  35%{opacity:0;transform:translateX(-40px)}
  100%{opacity:0}
}

/* dots */
.dots{
  position:absolute;
  bottom:14px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.4);
  animation:dotAnim 16s infinite;
}
.dot:nth-child(1){animation-delay:0s}
.dot:nth-child(2){animation-delay:4s}
.dot:nth-child(3){animation-delay:8s}
.dot:nth-child(4){animation-delay:12s}

@keyframes dotAnim{
  0%,25%{background:#fff}
  30%,100%{background:rgba(255,255,255,.4)}
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .hero-inner{
    flex-direction:column;
    text-align:center;
    padding:50px 20px;
  }
  .hero-text h1{font-size:32px}
  .hero-visual{height:260px;justify-content:center}
  .phone-slider{
    width:100%;
    max-width:420px;
    height:240px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo"><img src="pmc.png"></div>
  <span>India’s Easy Payment Gateway</span>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-text">
      <h1>Create a Link.<br>Share it.<br>Get Paid Instantly.</h1>
      <p>Accept payments via UPI, QR and cards with PayMoney.</p>
      <a href="#" class="btn btn-primary">Create Link</a>
      <a href="#how" class="btn btn-secondary">How it Works</a>
    </div>

    <div class="hero-visual">
      <div class="phone-slider">
        <div class="phone-slide" style="background-image:url('hero1.png')"></div>
        <div class="phone-slide" style="background-image:url('hero2.png')"></div>
        <div class="phone-slide" style="background-image:url('hero4.png')"></div>
        <div class="phone-slide" style="background-image:url('hero5.png')"></div>

        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<script>
const hero=document.querySelector('.hero');
new IntersectionObserver(
  e=>{if(e[0].isIntersecting)hero.classList.add('show')},
  {threshold:.35}
).observe(hero);
</script>

</body>
</html>
