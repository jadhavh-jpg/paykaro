<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Create Payment Links</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
body{margin:0;font-family:Inter,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
nav a{margin-left:16px;text-decoration:none;font-weight:600;color:#111}
.hero{padding:80px 20px;background:#0d3b66;color:#fff;text-align:center}
.btn{padding:14px 28px;border-radius:30px;border:none;font-weight:700;cursor:pointer}
.btn-white{background:#fff;color:#0d3b66}
</style>

<!-- 🔥 FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyBbdCgVVsvWH6o8NnMXMn0FyjNAyfD3Shc",
  authDomain: "paymoney24-cd9ad.firebaseapp.com",
  projectId: "paymoney24-cd9ad",
  storageBucket: "paymoney24-cd9ad.firebasestorage.app",
  messagingSenderId: "387349063100",
  appId: "1:387349063100:web:875bf9639beffe968177b9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

window.auth = auth;
window.RecaptchaVerifier = RecaptchaVerifier;
window.signInWithPhoneNumber = signInWithPhoneNumber;
</script>
</head>

<body>

<header>
  <b>PayMoney</b>
  <nav>
    <a href="javascript:void(0)" onclick="openLogin()">Login / Sign Up</a>
  </nav>
</header>

<section class="hero">
  <h1>Create a Link. Share it. Get Paid.</h1>
  <button class="btn btn-white" onclick="checkLogin('builder.html')">
    Create Payment Link
  </button>
</section>

<!-- 🔐 LOGIN MODAL -->
<div id="loginModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;">
  <div style="max-width:360px;margin:12% auto;background:#fff;padding:20px;border-radius:12px">

    <h3>Login to continue</h3>

    <input id="phone" placeholder="Enter mobile number"
      style="width:100%;padding:10px;margin:8px 0">

    <div id="recaptcha-container"></div>

    <button onclick="sendOTP()" style="width:100%;padding:10px;margin-top:6px">
      Send OTP
    </button>

    <input id="otp" placeholder="Enter OTP"
      style="width:100%;padding:10px;margin:8px 0">

    <button onclick="verifyOTP()" style="width:100%;padding:10px">
      Verify OTP
    </button>

    <button onclick="closeLogin()" style="margin-top:10px">
      Cancel
    </button>

  </div>
</div>

<script>
let nextPage = "";

function checkLogin(page){
  if(localStorage.getItem("loggedIn")==="yes"){
    window.location.href = page;
  }else{
    openLogin(page);
  }
}

function openLogin(page){
  nextPage = page || "";
  document.getElementById("loginModal").style.display = "block";

  if(!window.recaptchaVerifier){
    window.recaptchaVerifier = new RecaptchaVerifier(
      'recaptcha-container',
      { size:'invisible' },
      window.auth
    );
  }
}

function closeLogin(){
  document.getElementById("loginModal").style.display = "none";
}

function sendOTP(){
  let phone = document.getElementById("phone").value.trim();
  if(!phone) return alert("Enter mobile number");
  if(!phone.startsWith("+")) phone = "+91"+phone;

  signInWithPhoneNumber(window.auth, phone, window.recaptchaVerifier)
    .then(cr=>{
      window.confirmationResult = cr;
      alert("OTP sent");
    })
    .catch(e=>alert(e.message));
}

function verifyOTP(){
  let code = document.getElementById("otp").value;
  if(!window.confirmationResult) return alert("Send OTP first");

  window.confirmationResult.confirm(code)
    .then(()=>{
      localStorage.setItem("loggedIn","yes");
      closeLogin();
      if(nextPage) window.location.href = nextPage;
    })
    .catch(()=>alert("Wrong OTP"));
}
</script>

</body>
</html>
