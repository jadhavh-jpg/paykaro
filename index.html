<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PayMoney | Fast & Secure Payment Gateway for India</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">

<style>
:root{
  --blue:#0D3B66;
  --green:#2FB344;
  --light:#f8fafc;
}

*{margin:0;padding:0;box-sizing:border-box}
body{font-family:Inter,sans-serif;background:#fff;color:#111}

/* ================= HEADER ================= */
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 18px;
}
.logo img{height:72px}
header span{font-weight:600;color:#333}

/* ================= LAYOUT ================= */
.container{max-width:1200px;margin:auto;padding:60px 18px}
h1,h2{font-family:Poppins;font-weight:800}

/* ================= HERO ================= */
.hero{
  background:linear-gradient(135deg,#0D3B66,#1f7a52);
  border-radius:26px;
  color:#fff;
  overflow:hidden;
}
.hero-inner{
  display:flex;
  align-items:center;
  gap:50px;
}

/* scroll reveal */
.hero-text,.hero-visual{
  opacity:0;
  transform:translateY(40px);
  transition:.9s ease;
}
.hero.show .hero-text,
.hero.show .hero-visual{
  opacity:1;
  transform:translateY(0);
}

.hero-text{flex:1}
.hero-text h1{font-size:42px;line-height:1.15}
.hero-text p{margin:18px 0;font-size:18px;color:#eafff3}

/* ================= BUTTONS (3 layer) ================= */
.btn{
  position:relative;
  display:inline-block;
  padding:16px 40px;
  border-radius:44px;
  font-weight:700;
  text-decoration:none;
  margin:8px 12px 8px 0;
  transition:.25s ease;
  overflow:hidden;
}
.btn::before{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.25);
  transform:translateY(4px);
  border-radius:inherit;
  z-index:-2;
}
.btn::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:inherit;
  z-index:-1;
}
.btn-primary{color:#0D3B66}
.btn-primary::after{
  background:linear-gradient(135deg,#ffffff,#e8fff2);
}
.btn-primary:hover{transform:translateY(-2px)}

.btn-secondary{color:#fff}
.btn-secondary::after{
  background:rgba(255,255,255,.18);
  border:2px solid rgba(255,255,255,.5);
}

/* ================= HERO SLIDER ================= */
.hero-visual{
  flex:1;
  position:relative;
  height:340px;
  display:flex;
  justify-content:flex-end;
}

/* glow */
.hero-visual::before{
  content:"";
  position:absolute;
  inset:-60px;
  background:linear-gradient(120deg,#2FB344,#0ea5e9,#22c55e);
  filter:blur(100px);
  opacity:.45;
  animation:glow 10s linear infinite;
}
@keyframes glow{
  from{transform:rotate(0deg)}
  to{transform:rotate(360deg)}
}

/* slider frame (BIG) */
.phone-slider{
  width:560px;
  height:320px;
  position:relative;
  overflow:hidden;
  border-radius:28px;
}

/* slides */
.phone-slide{
  position:absolute;
  inset:0;
  background-size:cover;
  background-position:center;
  border-radius:28px;
  box-shadow:0 20px 45px rgba(0,0,0,.35);
  opacity:0;
  animation:slideShow 16s infinite;
  transition:transform .6s ease;
}

/* glass overlay */
.phone-slide::after{
  content:"";
  position:absolute;
  inset:0;
  background:rgba(255,255,255,.12);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  border-radius:28px;
}

/* PayMoney logo reflection */
.phone-slide::before{
  content:"";
  position:absolute;
  inset:0;
  background:url("pmc.png") center/140px no-repeat;
  opacity:.06;
}

/* hover zoom */
.phone-slider:hover .phone-slide{
  transform:scale(1.05);
}

/* pause on hover */
.phone-slider:hover .phone-slide{
  animation-play-state:paused;
}

/* timing */
.phone-slide:nth-child(1){animation-delay:0s}
.phone-slide:nth-child(2){animation-delay:4s}
.phone-slide:nth-child(3){animation-delay:8s}
.phone-slide:nth-child(4){animation-delay:12s}

@keyframes slideShow{
  0%{opacity:0;transform:translateX(40px)}
  10%{opacity:1;transform:translateX(0)}
  25%{opacity:1}
  35%{opacity:0;transform:translateX(-40px)}
  100%{opacity:0}
}

/* dots */
.dots{
  position:absolute;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:8px;
}
.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:rgba(255,255,255,.4);
  animation:dotAnim 16s infinite;
}
.dot:nth-child(1){animation-delay:0s}
.dot:nth-child(2){animation-delay:4s}
.dot:nth-child(3){animation-delay:8s}
.dot:nth-child(4){animation-delay:12s}

@keyframes dotAnim{
  0%,25%{background:#fff}
  30%,100%{background:rgba(255,255,255,.4)}
}

/* ================= SECTIONS ================= */
.grid{display:grid;gap:26px;margin-top:30px}
.grid-3{grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grid-5{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:26px;
  text-align:center;
  font-weight:600;
}
.card i{font-size:34px;color:var(--green);margin-bottom:12px}

/* ================= CTA ================= */
.cta{
  background:linear-gradient(135deg,#0D3B66,#1e5fa8);
  color:#fff;
  text-align:center;
  border-radius:26px;
}

/* ================= FOOTER ================= */
footer{
  background:#f1f5f9;
  padding:28px;
  text-align:center;
  font-size:14px;
}

/* ================= MOBILE ================= */
@media(max-width:768px){
  .hero-inner{flex-direction:column;text-align:center}
  .hero-text h1{font-size:30px}
  .btn{display:block;width:100%}
  .hero-visual{height:240px;justify-content:center}
  .phone-slider{width:100%;height:220px}
}
</style>
</head>

<body>

<header>
  <div class="logo"><img src="pmc.png"></div>
  <span>India’s Easy Payment Gateway</span>
</header>

<section class="container hero">
  <div class="hero-inner">
    <div class="hero-text">
      <h1>Create a Link.<br>Share it.<br>Get Paid Instantly.</h1>
      <p>Accept payments via UPI, QR and cards with PayMoney.</p>
      <a href="#" class="btn btn-primary">Create Link</a>
      <a href="#how" class="btn btn-secondary">How it Works</a>
    </div>

    <div class="hero-visual">
      <div class="phone-slider">
        <div class="phone-slide" style="background-image:url('hero1.png')"></div>
        <div class="phone-slide" style="background-image:url('hero2.png')"></div>
        <div class="phone-slide" style="background-image:url('hero4.png')"></div>
        <div class="phone-slide" style="background-image:url('hero5.png')"></div>

        <div class="dots">
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
          <div class="dot"></div>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="container" id="how">
  <h2>How It Works</h2>
</section>

<footer>© 2025 PayMoney • India’s Easy Payment Gateway</footer>

<script>
const hero=document.querySelector('.hero');
new IntersectionObserver(
  e=>{if(e[0].isIntersecting)hero.classList.add('show')},
  {threshold:.35}
).observe(hero);
</script>

</body>
</html>
