<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Login Test</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Firebase (ONLY WHAT IS NEEDED) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import {
    getAuth,
    RecaptchaVerifier,
    signInWithPhoneNumber
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBbdCgVVsvWH6o8NnMXMn0FyjNAyfD3Shc",
    authDomain: "paymoney24-cd9ad.firebaseapp.com",
    projectId: "paymoney24-cd9ad",
    storageBucket: "paymoney24-cd9ad.firebasestorage.app",
    messagingSenderId: "387349063100",
    appId: "1:387349063100:web:875bf9639beffe968177b9"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // expose globally
  window.auth = auth;
  window.RecaptchaVerifier = RecaptchaVerifier;
  window.signInWithPhoneNumber = signInWithPhoneNumber;
</script>

<style>
body{margin:0;font-family:Arial}
header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 20px;background:#fff;border-bottom:1px solid #ddd
}
.hero{
  height:70vh;display:flex;flex-direction:column;
  justify-content:center;align-items:center;
  background:#0d3b66;color:#fff
}
button{padding:12px 20px;border-radius:6px;border:none;cursor:pointer}

/* LOGIN MODAL */
#loginModal{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,.6);z-index:9999
}
#loginBox{
  max-width:360px;margin:12% auto;background:#fff;
  padding:20px;border-radius:12px
}
input{width:100%;padding:10px;margin:8px 0}
</style>
</head>

<body>

<header>
  <b>PayMoney</b>
  <a href="javascript:void(0)" onclick="openLogin()">Login / Sign Up</a>
</header>

<section class="hero">
  <h1>Create a Link. Share it. Get Paid.</h1>
  <button onclick="openLogin()">Create Payment Link</button>
</section>

<!-- 🔐 LOGIN MODAL -->
<div id="loginModal">
  <div id="loginBox">
    <h3>Login to continue</h3>

    <input id="phone" placeholder="Enter mobile number">

    <!-- reCAPTCHA ONLY ONCE -->
    <div id="recaptcha-container"></div>

    <button onclick="sendOTP()">Send OTP</button>

    <input id="otp" placeholder="Enter OTP">

    <button onclick="verifyOTP()">Verify OTP</button>

    <button onclick="closeLogin()" style="margin-top:10px">Cancel</button>
  </div>
</div>

<script>
let confirmationResult = null;

/* OPEN MODAL */
function openLogin(){
  document.getElementById("loginModal").style.display="block";
  initRecaptcha();
}

/* CLOSE MODAL */
function closeLogin(){
  document.getElementById("loginModal").style.display="none";
}

/* INIT reCAPTCHA (ONLY ONCE) */
function initRecaptcha(){
  if (!window.recaptchaVerifier) {
    window.recaptchaVerifier = new RecaptchaVerifier(
      'recaptcha-container',
      { size: 'invisible' },
      window.auth
    );
  }
}

/* SEND OTP */
function sendOTP(){
  let phone = document.getElementById("phone").value.trim();
  if(!phone){
    alert("Enter mobile number");
    return;
  }
  if(!phone.startsWith("+")){
    phone = "+91" + phone;
  }

  signInWithPhoneNumber(window.auth, phone, window.recaptchaVerifier)
    .then((result)=>{
      confirmationResult = result;
      alert("OTP sent");
    })
    .catch(err=>{
      alert(err.message);
    });
}

/* VERIFY OTP */
function verifyOTP(){
  const code = document.getElementById("otp").value;
  if(!confirmationResult){
    alert("Send OTP first");
    return;
  }

  confirmationResult.confirm(code)
    .then(()=>{
      alert("Login successful");
      localStorage.setItem("loggedIn","yes");
      closeLogin();
    })
    .catch(()=>{
      alert("Wrong OTP");
    });
}
</script>

</body>
</html>
