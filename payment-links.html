<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Generate Payment Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Inter, Arial, sans-serif;
  background:#f5f7fb;
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
}

.card{
  background:#ffffff;
  width:380px;
  padding:28px;
  border-radius:20px;
  box-shadow:0 14px 40px rgba(0,0,0,.15);
  text-align:center;
}

.logo{
  font-size:26px;
  font-weight:800;
  color:#0D3B66;
}

.subtitle{
  margin-top:6px;
  font-size:15px;
  color:#555;
}

input{
  width:100%;
  padding:14px;
  margin-top:16px;
  font-size:15px;
  border-radius:10px;
  border:1px solid #ddd;
}

button{
  width:100%;
  margin-top:20px;
  padding:15px;
  font-size:16px;
  font-weight:600;
  border:none;
  border-radius:14px;
  background:#0D3B66;
  color:#fff;
  cursor:pointer;
}

/* result area */
.result{
  margin-top:18px;
  display:none;
}

/* payment link (only link, no button) */
.paylink{
  display:block;
  margin-top:12px;
  font-size:14px;
  word-break:break-all;
  color:#0D3B66;
  text-decoration:underline;
  cursor:pointer;
}

/* animated copy button */
.copy-btn{
  margin-top:12px;
  padding:12px 18px;
  font-size:14px;
  font-weight:600;
  border:none;
  border-radius:12px;
  background:#2FB344;
  color:#fff;
  cursor:pointer;
  animation:pulse 2s infinite;
}

.copy-btn.copied{
  background:#1f7a32;
  animation:none;
}

/* pulse animation */
@keyframes pulse{
  0%{ box-shadow:0 0 0 0 rgba(47,179,68,0.6); }
  70%{ box-shadow:0 0 0 12px rgba(47,179,68,0); }
  100%{ box-shadow:0 0 0 0 rgba(47,179,68,0); }
}

/* QR box */
#qrBox{
  display:none;
  margin-top:16px;
}

#qrBox img{
  width:220px;
}

.note{
  margin-top:14px;
  font-size:12px;
  color:#777;
}
</style>
</head>

<body>

<div class="card">
  <div class="logo">PayMoney</div>
  <div class="subtitle">Generate Payment Link</div>

  <input type="text" id="upi" placeholder="Enter your UPI ID (example@upi)">
  <input type="number" id="amt" placeholder="Enter Amount (₹)">

  <button onclick="generateLink()">Generate Payment Link</button>

  <div class="result" id="resultBox">

    <!-- ONE SMART LINK -->
    <a href="#" id="paymentLink" class="paylink" onclick="handlePayment(event)"></a>

    <!-- COPY BUTTON -->
    <button class="copy-btn" id="copyBtn" onclick="copyLink()">Copy Link</button>

    <!-- DESKTOP QR -->
    <div id="qrBox">
      <p><b>Scan & Pay</b></p>
      <img id="qrImg">
    </div>
  </div>

  <div class="note">
    One link • Mobile pays • Desktop shows QR
  </div>
</div>

<script>
var generatedLink = "";

function generateLink(){
  var upi = document.getElementById("upi").value.trim();
  var amt = document.getElementById("amt").value;

  if(!upi || upi.indexOf("@") === -1){
    alert("Enter valid UPI ID");
    return;
  }
  if(!amt || amt <= 0){
    alert("Enter valid amount");
    return;
  }

  generatedLink =
    "upi://pay?pa=" + encodeURIComponent(upi) +
    "&pn=PayMoney" +
    "&am=" + amt +
    "&cu=INR";

  var linkEl = document.getElementById("paymentLink");
  linkEl.textContent = generatedLink;

  document.getElementById("resultBox").style.display = "block";
  document.getElementById("qrBox").style.display = "none";

  // reset copy button
  var btn = document.getElementById("copyBtn");
  btn.textContent = "Copy Link";
  btn.classList.remove("copied");
}

function handlePayment(e){
  e.preventDefault();

  // Mobile → open UPI app
  if(/Android|iPhone|iPad/i.test(navigator.userAgent)){
    window.location.href = generatedLink;
  }
  // Desktop → show QR
  else{
    var qr =
      "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
      encodeURIComponent(generatedLink);

    document.getElementById("qrImg").src = qr;
    document.getElementById("qrBox").style.display = "block";
  }
}

function copyLink(){
  navigator.clipboard.writeText(generatedLink).then(()=>{
    var btn = document.getElementById("copyBtn");
    btn.textContent = "Copied ✓";
    btn.classList.add("copied");
  });
}
</script>

</body>
</html>
