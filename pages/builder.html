<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Landing Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}
body{font-family:Arial;background:#f5f7fb;margin:0}
.wrapper{max-width:1200px;margin:30px auto;display:flex;gap:20px}
.panel{background:#fff;border-radius:16px;padding:20px;width:50%}
label{font-weight:600;margin-top:12px;display:block}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:6px}

button{
  margin-top:18px;
  width:100%;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  opacity:.5;
}
button.enabled{opacity:1}

.card{border:1px solid #ddd;border-radius:16px;overflow:hidden}
.poster{
  width:100%;
  aspect-ratio:2/3;
  background:#e5e7eb;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.c{padding:16px}
.pay{
  margin-top:14px;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  text-align:center;
  border-radius:12px;
  opacity:.4;
}
.small{font-size:13px;color:#555}
</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT FORM -->
<div class="panel">
<h2>Create Landing Page</h2>

<label>Brand</label>
<input id="brand" oninput="updatePreview()">

<label>Poster Image (2:3)</label>
<input type="file" accept="image/*" onchange="loadImage(event)">

<label>Title</label>
<input id="title" oninput="updatePreview()">

<label>Date & Time</label>
<input id="dt" oninput="updatePreview()">

<label>Payment Link</label>
<input id="pay">

<label>Description</label>
<textarea id="desc" oninput="updatePreview()"></textarea>

<button id="genBtn" onclick="generate()">Generate Landing Page</button>
</div>

<!-- RIGHT PREVIEW -->
<div class="panel">
<h3>Live Preview</h3>

<div class="card">
  <div class="poster" id="pimg"></div>
  <div class="c">
    <b id="pbrand"></b>
    <h3 id="ptitle"></h3>
    <div class="small" id="pdt"></div>
    <p id="pdesc"></p>
    <div class="pay">Pay Money</div>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>
</div>

</div>

<script>
let posterReady=false;
let posterData="";

function loadImage(e){
  const file=e.target.files[0];
  if(!file)return;

  const reader=new FileReader();
  reader.onload=()=>{
    posterData=reader.result;
    document.getElementById("pimg").innerHTML =
      `<img src="${posterData}">`;
    posterReady=true;
    document.getElementById("genBtn").classList.add("enabled");
  };
  reader.readAsDataURL(file);
}

function updatePreview(){
  pbrand.innerText=brand.value;
  ptitle.innerText=title.value;
  pdt.innerText=dt.value;
  pdesc.innerText=desc.value;
}

function generate(){
  if(!posterReady){
    alert("Please select image first");
    return;
  }

  const id="PM"+Date.now();
  const data={
    brand:brand.value,
    title:title.value,
    dt:dt.value,
    desc:desc.value,
    pay:pay.value,
    poster:posterData
  };

  localStorage.setItem("paymoney_"+id,JSON.stringify(data));
  window.open("landing.html?id="+id,"_blank");
}
</script>

</body>
</html>
