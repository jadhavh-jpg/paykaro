<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Create Landing Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f5f7fb;
  margin:0;
}
.wrapper{
  max-width:1200px;
  margin:30px auto;
  display:flex;
  gap:20px;
}
.panel{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:50%;
}
label{font-weight:600;margin-top:14px;display:block;}
input, textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}
small{color:#666;font-size:13px;}
button{
  margin-top:18px;
  width:100%;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  border:none;
  border-radius:12px;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  transition:.3s;
}
button:hover{
  transform:translateY(-2px);
  box-shadow:0 8px 20px rgba(13,59,102,.3);
}

/* PREVIEW */
.preview-card{
  border-radius:16px;
  overflow:hidden;
  border:1px solid #ddd;
  max-width:420px;
  margin:auto;
}
.poster{
  width:100%;
  aspect-ratio:2/3;
  background:#eee;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.content{padding:16px;}
.paybtn{
  margin-top:14px;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  text-align:center;
  border-radius:12px;
  opacity:.7;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT -->
<div class="panel">
<h2>Create Landing Page</h2>

<label>Brand / Seller Name</label>
<input id="brand" oninput="updatePreview()">

<label>Poster Image</label>
<input type="file" accept="image/*" onchange="loadPoster(event)">
<small>📐 Recommended ratio 2:3 (any size allowed – auto fit)</small>

<label>Title</label>
<input id="title" oninput="updatePreview()">

<label>Date & Time</label>
<input id="datetime" oninput="updatePreview()">

<label>Payment Link (UPI / Gateway)</label>
<input id="paymentLink">

<label>Description</label>
<textarea id="desc" oninput="updatePreview()"></textarea>

<button onclick="generateLanding()">Generate Landing Page</button>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>Live Preview</h3>

<div class="preview-card">
  <div class="poster" id="posterBox">Poster Preview</div>
  <div class="content">
    <b id="pBrand"></b>
    <h3 id="pTitle"></h3>
    <div id="pDT"></div>
    <p id="pDesc"></p>
    <div class="paybtn">Pay Money</div>
  </div>
</div>
</div>

</div>

<script>
let posterData = "";

function loadPoster(e){
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    posterData = reader.result;
    posterBox.innerHTML = `<img src="${posterData}">`;
  };
  reader.readAsDataURL(file);
}

function updatePreview(){
  pBrand.innerText = brand.value;
  pTitle.innerText = title.value;
  pDT.innerText = datetime.value;
  pDesc.innerText = desc.value;
}

function uid(){
  return "PM" + Date.now();
}

function generateLanding(){
  if(!posterData){
    alert("⚠️ Please wait for image to load");
    return;
  }

  const id = uid();
  const data = {
    brand: brand.value,
    title: title.value,
    datetime: datetime.value,
    desc: desc.value,
    paymentLink: paymentLink.value,
    poster: posterData
  };

  localStorage.setItem("paymoney_" + id, JSON.stringify(data));

  alert("✅ Landing page created successfully!");

  window.open("landing.html?id=" + id, "_blank");
}
</script>

</body>
</html>
