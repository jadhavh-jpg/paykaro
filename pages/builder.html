<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Create Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.wrap{max-width:900px;margin:20px auto;display:flex;gap:20px}
.box{background:#fff;padding:16px;border-radius:12px;width:50%}
label{display:block;font-weight:600;margin-top:10px}
input,textarea{width:100%;padding:8px;margin-top:5px}
button{margin-top:15px;padding:14px;width:100%;
background:#0D3B66;color:#fff;border:none;border-radius:10px;
font-weight:600;cursor:pointer}
button:hover{background:#09406f}
.preview{border:1px solid #ddd;border-radius:12px;overflow:hidden}
.poster{height:300px;background:#eee;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.p{padding:12px}
</style>
</head>

<body>

<div class="wrap">

<!-- FORM -->
<div class="box">
<h2>Create Landing</h2>

<label>Brand</label>
<input id="brand">

<label>Poster Image</label>
<input type="file" accept="image/*" onchange="loadImg(event)">

<label>Title</label>
<input id="title">

<label>Date & Time</label>
<input id="dt">

<label>Description</label>
<textarea id="desc"></textarea>

<label>Payment Link</label>
<input id="pay">

<button onclick="create()">Create Landing Page</button>
</div>

<!-- PREVIEW -->
<div class="box">
<h3>Preview</h3>
<div class="preview">
  <div class="poster" id="poster"></div>
  <div class="p">
    <b id="pBrand"></b>
    <h3 id="pTitle"></h3>
    <div id="pDT"></div>
    <p id="pDesc"></p>
    <div style="margin-top:10px;
      background:#cfe1ff;padding:12px;
      border-radius:8px;text-align:center">
      Pay Money
    </div>
  </div>
</div>
</div>

</div>

<script>
let imgData="";

function loadImg(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    imgData=r.result;
    poster.innerHTML=`<img src="${imgData}">`;
  };
  r.readAsDataURL(f);
}

function create(){
  const q=new URLSearchParams({
    brand:brand.value,
    title:title.value,
    dt:dt.value,
    desc:desc.value,
    pay:pay.value,
    img:imgData
  }).toString();

  window.open("landing.html?"+q,"_blank");
}
</script>

</body>
</html>
