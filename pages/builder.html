<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Landing Page Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f5f7fb;
  margin:0;
}
.wrapper{
  max-width:1200px;
  margin:30px auto;
  display:flex;
  gap:20px;
}
.panel{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:50%;
}
label{
  font-weight:600;
  display:block;
  margin-top:12px;
}
input, textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}
button{
  margin-top:18px;
  width:100%;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  border:none;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}

/* ===== PREVIEW ===== */
.preview-card{
  border-radius:16px;
  overflow:hidden;
  border:1px solid #ddd;
}

/* 🔒 POSTER FIX (2:3) */
.poster{
  width:100%;
  aspect-ratio:2 / 3;
  background:#e5e7eb;
  overflow:hidden;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.content{
  padding:16px;
}

/* ===== 3-LAYER PAY BUTTON ===== */
.paybtn{
  margin-top:14px;
  padding:14px;
  text-align:center;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .25s ease;
  background:#dbeafe;      /* Simple */
  color:#0D3B66;
}
.paybtn:hover{
  background:#93c5fd;      /* Soft Dark */
}
.paybtn:active{
  background:#0D3B66;      /* Dark */
  color:#fff;
}

.small{
  font-size:13px;
  color:#555;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT FORM -->
<div class="panel">
<h2>Create Your Landing Page</h2>

<label>Brand / Seller Name</label>
<input id="brand" oninput="updatePreview()">

<label>Poster Image (2:3)</label>
<input type="file" accept="image/*" onchange="loadPoster(event)">

<label>Title</label>
<input id="title" oninput="updatePreview()">

<label>Date & Time</label>
<input id="datetime" oninput="updatePreview()">

<label>Payment Link</label>
<input id="paymentLink" placeholder="https://payment-link or upi://pay">

<label>WhatsApp Number</label>
<input id="wa">

<label>Description</label>
<textarea id="desc" oninput="updatePreview()"></textarea>

<button onclick="generateLanding()">Generate Landing Page</button>
</div>

<!-- RIGHT LIVE PREVIEW -->
<div class="panel">
<h3>Live Preview</h3>

<div class="preview-card">
  <div class="poster" id="posterBox">Poster Preview</div>

  <div class="content">
    <b id="pBrand"></b>
    <h3 id="pTitle"></h3>
    <div class="small" id="pDT"></div>
    <p id="pDesc"></p>

    <div class="paybtn">Pay Money</div>
    <div class="small">WhatsApp Support</div>
  </div>
</div>
</div>

</div>

<script>
let posterData = "";

/* ===== IMAGE AUTO RESIZE (2:3) ===== */
function loadPoster(event){
  const file = event.target.files[0];
  if(!file) return;

  const img = new Image();
  const reader = new FileReader();

  reader.onload = e => img.src = e.target.result;
  reader.readAsDataURL(file);

  img.onload = () => {
    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");

    const WIDTH = 600;
    const HEIGHT = 900;
    canvas.width = WIDTH;
    canvas.height = HEIGHT;

    const ratio = Math.max(WIDTH/img.width, HEIGHT/img.height);
    const x = (WIDTH - img.width * ratio) / 2;
    const y = (HEIGHT - img.height * ratio) / 2;

    ctx.drawImage(img, x, y, img.width * ratio, img.height * ratio);
    posterData = canvas.toDataURL("image/jpeg", 0.8);

    posterBox.innerHTML = `<img src="${posterData}">`;
  };
}

/* ===== LIVE PREVIEW ===== */
function updatePreview(){
  pBrand.innerText = brand.value;
  pTitle.innerText = title.value;
  pDT.innerText = datetime.value;
  pDesc.innerText = desc.value;
}

/* ===== LANDING GENERATE ===== */
function uid(){
  return "PM" + Date.now();
}

function generateLanding(){
  const id = uid();

  const data = {
    id,
    brand: brand.value,
    title: title.value,
    datetime: datetime.value,
    desc: desc.value,
    paymentLink: paymentLink.value,
    wa: wa.value,
    poster: posterData
  };

  const all = JSON.parse(localStorage.getItem("paymoneyLandings") || "{}");
  all[id] = data;
  localStorage.setItem("paymoneyLandings", JSON.stringify(all));

  window.open("landing.html?id=" + id, "_blank");
}
</script>

</body>
</html>
