<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Landing Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.wrapper{max-width:1200px;margin:30px auto;display:flex;gap:20px}
.panel{background:#fff;border-radius:16px;padding:20px;width:50%}

label{font-weight:600;margin-top:14px;display:block}
input,textarea{
  width:100%;padding:10px;margin-top:6px;
  border-radius:8px;border:1px solid #ccc
}
small{font-size:13px;color:#666}

button{
  margin-top:18px;width:100%;padding:14px;
  background:#0D3B66;color:#fff;border:none;
  border-radius:12px;font-weight:600;
  cursor:pointer
}

.preview-card{
  border-radius:16px;overflow:hidden;
  border:1px solid #ddd;max-width:420px;margin:auto
}
.poster{
  aspect-ratio:2/3;background:#eee;
  display:flex;align-items:center;justify-content:center
}
.poster img{width:100%;height:100%;object-fit:cover}
.content{padding:16px}
.paybtn{
  margin-top:14px;padding:14px;
  background:#0D3B66;color:#fff;
  text-align:center;border-radius:12px;
  opacity:.6
}
</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT -->
<div class="panel">
<h2>Create Landing Page</h2>

<label>Brand</label>
<input id="brand" oninput="preview()">

<label>Poster Image</label>
<input type="file" accept="image/*" onchange="loadImg(event)">
<small>Recommended ratio 2:3 (any size allowed)</small>

<label>Title</label>
<input id="title" oninput="preview()">

<label>Date & Time</label>
<input id="dt" oninput="preview()">

<label>Payment Link</label>
<input id="pay">

<label>Description</label>
<textarea id="desc" oninput="preview()"></textarea>

<button onclick="generate()">Generate Landing Page</button>
</div>

<!-- RIGHT -->
<div class="panel">
<h3>Live Preview</h3>
<div class="preview-card">
  <div class="poster" id="pimg">Poster Preview</div>
  <div class="content">
    <b id="pbrand"></b>
    <h3 id="ptitle"></h3>
    <div id="pdt"></div>
    <p id="pdesc"></p>
    <div class="paybtn">Pay Money</div>
  </div>
</div>
</div>

</div>

<script>
let posterData="";

function loadImg(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    posterData=r.result;
    pimg.innerHTML=`<img src="${posterData}">`;
  };
  r.readAsDataURL(f);
}

function preview(){
  pbrand.innerText=brand.value;
  ptitle.innerText=title.value;
  pdt.innerText=dt.value;
  pdesc.innerText=desc.value;
}

function generate(){
  if(!posterData){
    alert("Please wait for image to load");
    return;
  }
  const id="PM"+Date.now();
  const data={
    brand:brand.value,
    title:title.value,
    dt:dt.value,
    desc:desc.value,
    pay:pay.value,
    poster:posterData
  };
  localStorage.setItem("paymoney_"+id,JSON.stringify(data));
  alert("✅ Landing page created successfully!");
  window.open("landing.html?id="+id,"_blank");
}
</script>

</body>
</html>
