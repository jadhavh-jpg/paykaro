<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Landing Page Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
  font-family:Arial, sans-serif;
  background:#f5f7fb;
  margin:0;
}

.wrapper{
  max-width:1100px;
  margin:20px auto;
  display:flex;
  gap:20px;
}

.panel{
  background:#fff;
  border-radius:14px;
  padding:18px;
  width:50%;
}

/* ---------- FORM ---------- */
label{
  font-weight:600;
  margin-top:12px;
  display:block;
}
input, textarea{
  width:100%;
  padding:10px;
  margin-top:6px;
  border-radius:8px;
  border:1px solid #ccc;
}

/* 🔥 CREATE BUTTON WITH HOVER */
button{
  margin-top:18px;
  width:100%;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  border:none;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
  transition:all .25s ease;
}
button:hover{
  background:#09406f;
  transform:translateY(-1px);
  box-shadow:0 10px 20px rgba(13,59,102,.25);
}
button:active{
  transform:scale(.98);
}

/* ---------- PREVIEW ---------- */
.preview-card{
  border:1px solid #ddd;
  border-radius:14px;
  overflow:hidden;
}

/* 🔒 FIXED POSTER FRAME (NO OUT OF FRAME) */
.poster{
  width:100%;
  height:360px;
  background:#e5e7eb;
  overflow:hidden;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.content{
  padding:14px;
}

/* PREVIEW PAY BUTTON (DISABLED) */
.paybtn{
  margin-top:12px;
  padding:14px;
  text-align:center;
  border-radius:10px;
  background:#cfe1ff;
  color:#0D3B66;
  font-weight:600;
  opacity:.6;
  pointer-events:none;
}

.small{
  font-size:13px;
  color:#555;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="wrapper">

<!-- LEFT PANEL -->
<div class="panel">
<h2>Create Landing Page</h2>

<label>Brand / Seller Name</label>
<input id="brand" oninput="updatePreview()">

<label>Poster Image</label>
<input type="file" accept="image/*" onchange="loadPoster(event)">

<label>Title</label>
<input id="title" oninput="updatePreview()">

<label>Date & Time</label>
<input id="datetime" oninput="updatePreview()">

<label>Payment Link</label>
<input id="paymentLink" placeholder="https://payment-link or upi://pay">

<label>WhatsApp Number</label>
<input id="wa">

<label>Description</label>
<textarea id="desc" oninput="updatePreview()"></textarea>

<button onclick="generateLanding()">Create Landing Page</button>
</div>

<!-- RIGHT PANEL -->
<div class="panel">
<h3>Live Preview</h3>

<div class="preview-card">
  <div class="poster" id="posterBox"></div>

  <div class="content">
    <b id="pBrand"></b>
    <h3 id="pTitle"></h3>
    <div class="small" id="pDT"></div>
    <p id="pDesc"></p>

    <div class="paybtn">Pay Money</div>
    <div class="small">WhatsApp Support</div>
  </div>
</div>
</div>

</div>

<script>
let posterData = "";
let posterReady = false; // 🔥 IMPORTANT FLAG

/* ===== IMAGE LOAD (ASYNC SAFE) ===== */
function loadPoster(e){
  const file = e.target.files[0];
  if(!file) return;

  posterReady = false;
  posterBox.innerHTML = "Loading image...";

  const reader = new FileReader();
  reader.onload = () => {
    posterData = reader.result;
    posterBox.innerHTML = `<img src="${posterData}">`;
    posterReady = true; // ✅ IMAGE READY
  };
  reader.readAsDataURL(file);
}

/* ===== LIVE PREVIEW ===== */
function updatePreview(){
  pBrand.innerText = brand.value;
  pTitle.innerText = title.value;
  pDT.innerText = datetime.value;
  pDesc.innerText = desc.value;
}

/* ===== STRONG UNIQUE ID ===== */
function uid(){
  return "PM" + Date.now() + Math.floor(Math.random()*10000);
}

/* ===== GENERATE LANDING (SAFE) ===== */
function generateLanding(){

  if(!posterReady){
    alert("Please select an image and wait a moment before creating the landing page.");
    return;
  }

  const id = uid();

  const data = {
    id,
    brand: brand.value,
    title: title.value,
    datetime: datetime.value,
    desc: desc.value,
    paymentLink: paymentLink.value,
    wa: wa.value,
    poster: posterData
  };

  const all = JSON.parse(localStorage.getItem("paymoneyLandings") || "{}");
  all[id] = data;
  localStorage.setItem("paymoneyLandings", JSON.stringify(all));

  window.open("landing.html?id=" + id, "_blank");
}
</script>

</body>
</html>
