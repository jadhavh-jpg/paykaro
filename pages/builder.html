<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f5f7fb;
  margin:0;
}
.wrapper{
  max-width:1200px;
  margin:30px auto;
  display:flex;
  gap:20px;
}
.panel{
  background:#fff;
  border-radius:16px;
  padding:20px;
  width:50%;
}
label{font-weight:600;display:block;margin-top:12px}
input,textarea{
  width:100%;padding:10px;margin-top:6px;
  border-radius:8px;border:1px solid #ccc
}
button{
  margin-top:18px;width:100%;padding:14px;
  background:#0D3B66;color:#fff;border:none;
  border-radius:12px;font-weight:600;
  cursor:pointer;
}
button:hover{background:#114c85}

/* Preview */
.card{border-radius:16px;overflow:hidden;border:1px solid #ddd}
.poster{aspect-ratio:2/3;background:#e5e7eb}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.pay{
  margin-top:14px;padding:14px;
  background:#0D3B66;color:#fff;
  text-align:center;border-radius:12px;
}
.small{font-size:13px;color:#555}
</style>
</head>

<body>

<div class="wrapper">

<!-- FORM -->
<div class="panel">
<h2>Create Landing Page</h2>

<label>Brand</label>
<input id="brand" oninput="update()">

<label>Poster Image (Any Size)</label>
<input type="file" accept="image/*" onchange="loadImg(event)">

<label>Title</label>
<input id="title" oninput="update()">

<label>Date & Time</label>
<input id="dt" oninput="update()">

<label>Payment Link (UPI / Gateway)</label>
<input id="pay">

<label>Description</label>
<textarea id="desc" oninput="update()"></textarea>

<button onclick="generate()">Generate Landing Page</button>
</div>

<!-- PREVIEW -->
<div class="panel">
<h3>Live Preview</h3>
<div class="card">
  <div class="poster" id="pimg"></div>
  <div class="c">
    <b id="pbrand"></b>
    <h3 id="ptitle"></h3>
    <div class="small" id="pdt"></div>
    <p id="pdesc"></p>
    <div class="pay">Pay Money</div>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>
</div>

</div>

<script>
let poster="";

function loadImg(e){
  const r=new FileReader();
  r.onload=()=>{poster=r.result;pimg.innerHTML=`<img src="${poster}">`};
  r.readAsDataURL(e.target.files[0]);
}

function update(){
  pbrand.innerText=brand.value;
  ptitle.innerText=title.value;
  pdt.innerText=dt.value;
  pdesc.innerText=desc.value;
}

function generate(){
  if(!poster){alert("Please wait for image to load");return;}
  const id="PM"+Date.now();
  const data={
    brand:brand.value,
    title:title.value,
    dt:dt.value,
    desc:desc.value,
    pay:pay.value,
    poster
  };
  localStorage.setItem("paymoney_"+id,JSON.stringify(data));
  window.open("landing.html?id="+id,"_blank");
}
</script>

</body>
</html>
