<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial, sans-serif;
  background:#f5f7fb;
  margin:0;
}
.box{
  max-width:420px;
  margin:30px auto;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
.poster{
  width:100%;
  height:420px;
  overflow:hidden;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.content{padding:16px}
.paybtn{
  margin-top:14px;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  text-align:center;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}
.small{font-size:13px;color:#666;margin-top:6px}
</style>
</head>

<body>

<div class="box">
  <div class="poster" id="poster"></div>
  <div class="content">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div class="small" id="dt"></div>
    <p id="desc"></p>
    <div class="paybtn" id="payBtn">Pay Money</div>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>

<script>
const params=new URLSearchParams(location.search);
const id=params.get("id");

const all=JSON.parse(localStorage.getItem("paymoneyLandings")||"{}");
const d=all[id];

if(!d){
  document.body.innerHTML="Landing not found";
  throw "";
}

brand.innerText=d.brand;
title.innerText=d.title;
dt.innerText=d.datetime;
desc.innerText=d.desc;
poster.innerHTML=`<img src="${d.poster}">`;

payBtn.onclick=()=>{
  window.location.href=d.paymentLink;
};
</script>

</body>
</html>
