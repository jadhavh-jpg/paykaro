<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PayMoney</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.card{max-width:420px;margin:40px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.poster{aspect-ratio:2/3}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.btn{margin-top:14px;padding:14px;background:#0D3B66;color:#fff;text-align:center;border-radius:12px;cursor:pointer}
.small{font-size:13px;color:#555}
</style>
</head>

<body>

<div class="card">
  <div class="poster"><img id="img"></div>
  <div class="c">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div class="small" id="dt"></div>
    <p id="desc"></p>
   <div class="btn" id="payBtn">Pay via UPI</div>

<div id="qrBox" style="display:none; margin-top:16px; text-align:center;">
  <img id="qrImg" alt="UPI QR" />
  <p>Scan & Pay using any UPI App</p>
</div>

    <div class="small">Powered by PayMoney</div>
  </div>
</div>

<script>
const upiLink =
  "upi://pay?pa=paykaro@upi&pn=PayKaro&am=99&cu=INR&tn=aaa";

document.getElementById("payBtn").addEventListener("click", function () {
  const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

  if (isMobile) {
    // 📱 Mobile → UPI app open (Chrome included)
    window.location.href = upiLink;
  } else {
    // 💻 Desktop → QR generate
    const qrUrl =
      "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
      encodeURIComponent(upiLink);

    document.getElementById("qrImg").src = qrUrl;
    document.getElementById("qrBox").style.display = "block";
  }
});
</script>


</body>
</html>
