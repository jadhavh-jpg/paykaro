<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Landing</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  background:#f5f7fb;
}
.container{
  max-width:420px;
  margin:30px auto;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 10px 30px rgba(0,0,0,.1);
}
.poster{
  width:100%;
  height:420px;
  overflow:hidden;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.content{
  padding:16px;
}
.paybtn{
  margin-top:14px;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  text-align:center;
  border-radius:10px;
  font-weight:600;
  cursor:pointer;
}
.small{
  font-size:13px;
  color:#666;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="container">
  <div class="poster" id="poster"></div>

  <div class="content">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div class="small" id="dt"></div>
    <p id="desc"></p>

    <div class="paybtn" id="payBtn">Pay Money</div>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>

<script>
/* GET ID */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

if(!id){
  document.body.innerHTML = "Invalid landing link";
  throw "No ID";
}

/* LOAD DATA */
const all = JSON.parse(localStorage.getItem("paymoneyLandings") || "{}");
const data = all[id];

if(!data){
  document.body.innerHTML = "Landing expired or not found";
  throw "No Data";
}

/* SET CONTENT */
document.getElementById("brand").innerText = data.brand;
document.getElementById("title").innerText = data.title;
document.getElementById("dt").innerText = data.datetime;
document.getElementById("desc").innerText = data.desc;
document.getElementById("poster").innerHTML =
  `<img src="${data.poster}">`;

/* PAY BUTTON */
document.getElementById("payBtn").onclick = () => {
  window.location.href = data.paymentLink;
};
</script>

</body>
</html>
