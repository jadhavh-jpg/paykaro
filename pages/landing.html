<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PayMoney</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.card{max-width:420px;margin:40px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.poster{aspect-ratio:2/3}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.btn{
  margin-top:14px;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  text-align:center;
  border-radius:12px;
  cursor:pointer;
  display:block;
  text-decoration:none;
}
.small{font-size:13px;color:#555;text-align:center;margin-top:8px}

#qrBox{
  margin-top:14px;
  text-align:center;
}
#qrBox img{
  width:220px;
  height:220px;
}
</style>
</head>

<body>

<div class="card">
  <div class="poster"><img id="img"></div>
  <div class="c">
    <b id="brand">PayKaro</b>
    <h3 id="title">aaa</h3>
    <div class="small" id="dt"></div>
    <p id="desc"></p>

    <!-- 🔵 MAIN BUTTON -->
    <a id="payBtn" class="btn">Pay via UPI</a>

    <!-- 🟡 HELPER TEXT -->
    <div class="small">
      If app doesn’t open, scan QR
    </div>

    <!-- 🟢 QR ALWAYS VISIBLE -->
    <div id="qrBox">
      <img id="qrImg">
    </div>

    <div class="small" style="margin-top:10px">
      Powered by PayMoney
    </div>
  </div>
</div>

<script>
const d = JSON.parse(sessionStorage.getItem("paymoneyData") || "{}");

const upiLink =
  d.pay || "upi://pay?pa=paykaro@upi&pn=PayKaro&am=99&cu=INR&tn=aaa";

// bind optional data
if(d.poster) img.src = d.poster;
brand.innerText = d.brand || "PayKaro";
title.innerText = d.title || "aaa";
dt.innerText = d.dt || "";
desc.innerText = d.desc || "";

// BUTTON → TRY UPI
payBtn.href = upiLink;

// QR → ALWAYS READY (fallback)
qrImg.src =
  "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
  encodeURIComponent(upiLink);
</script>

</body>
</html>
