<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#eef2f7;margin:0}
.card{max-width:420px;margin:40px auto;background:#fff;border-radius:16px;overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.1)}
.poster{height:420px;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.btn{margin-top:14px;padding:14px;background:#0D3B66;color:#fff;
text-align:center;border-radius:10px;font-weight:600;text-decoration:none;display:block}
.small{font-size:13px;color:#666;margin-top:8px;text-align:center}
</style>
</head>

<body>

<div class="card">
  <div class="poster"><img id="img"></div>
  <div class="c">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div class="small" id="dt"></div>
    <p id="desc"></p>

    <a id="payBtn" class="btn" href="#">Pay Money</a>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>

<script>
const p=new URLSearchParams(location.search);

const brand=p.get("brand")||"";
const title=p.get("title")||"";
const dt=p.get("dt")||"";
const desc=p.get("desc")||"";
const payLink=decodeURIComponent(p.get("pay")||"");
const poster=decodeURIComponent(p.get("poster")||"");

document.getElementById("brand").innerText=brand;
document.getElementById("title").innerText=title;
document.getElementById("dt").innerText=dt;
document.getElementById("desc").innerText=desc;
if(poster) document.getElementById("img").src=poster;

document.getElementById("payBtn").onclick=function(e){
  e.preventDefault();
  if(!payLink){alert("Payment link missing");return;}

  // MOBILE + DESKTOP UPI
  window.location.href=payLink;

  // fallback
  setTimeout(()=>{window.open(payLink,"_blank")},700);
};
</script>

</body>
</html>
