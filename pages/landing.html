<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.card{
  max-width:420px;margin:20px auto;
  background:#fff;border-radius:16px;
  overflow:hidden;box-shadow:0 12px 30px rgba(0,0,0,.15)
}
.poster{aspect-ratio:2/3}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.btn{
  margin-top:14px;padding:14px;
  background:#0D3B66;color:#fff;
  text-align:center;border-radius:12px;
  font-size:16px;font-weight:600
}
.wa{background:#25D366}
.small{text-align:center;font-size:13px;color:#666;margin-top:8px}
</style>
</head>

<body>

<div class="card">
  <div class="poster" id="poster"></div>
  <div class="c">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div id="dt"></div>
    <p id="desc"></p>

    <div class="btn" id="payBtn">Pay via UPI</div>
    <div class="btn wa" id="waBtn">Share on WhatsApp</div>

    <div class="small">Powered by PayMoney</div>
  </div>
</div>

<script>
const id=new URLSearchParams(location.search).get("id");
const data=JSON.parse(localStorage.getItem("paymoney_"+id)||"null");

if(!data){
  document.body.innerHTML="Invalid or expired link";
}else{
  poster.innerHTML=`<img src="${data.poster}">`;
  brand.innerText=data.brand;
  title.innerText=data.title;
  dt.innerText=data.dt;
  desc.innerText=data.desc;

  const isMobile=/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

  payBtn.onclick=()=>{
    if(isMobile){
      // 📱 MOBILE → direct UPI intent
      window.location.href=data.pay;
    }else{
      // 🖥 DESKTOP → QR fallback
      window.open(data.pay,"_blank");
    }
  };

  waBtn.onclick=()=>{
    const msg=
      "Hello 👋%0A"+
      "Please complete payment here:%0A"+
      window.location.href;
    window.open("https://wa.me/?text="+msg,"_blank");
  };
}
</script>

</body>
</html>
