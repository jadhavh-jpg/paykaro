<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.card{max-width:420px;margin:30px auto;
background:#fff;border-radius:16px;
overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.poster{height:420px;overflow:hidden}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.btn{margin-top:14px;padding:14px;
background:#0D3B66;color:#fff;
text-align:center;border-radius:10px;
font-weight:600;cursor:pointer}
.small{font-size:13px;color:#666;margin-top:6px}
</style>
</head>

<body>

<div class="card">
  <div class="poster" id="poster"></div>
  <div class="c">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div class="small" id="dt"></div>
    <p id="desc"></p>
    <div class="btn" id="payBtn">Pay Money</div>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>

<script>
const p=new URLSearchParams(location.search);

brand.innerText=p.get("brand")||"";
title.innerText=p.get("title")||"";
dt.innerText=p.get("dt")||"";
desc.innerText=p.get("desc")||"";

const img=p.get("img");
if(img){
  poster.innerHTML=`<img src="${img}">`;
}else{
  poster.style.display="none";
}

payBtn.onclick=()=>{
  location.href=p.get("pay");
};
</script>

</body>
</html>
