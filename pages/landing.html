<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PayMoney</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.card{max-width:420px;margin:40px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.poster{aspect-ratio:2/3}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.btn{
  margin-top:14px;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  text-align:center;
  border-radius:12px;
  cursor:pointer;
  display:block;
  text-decoration:none;
}
.small{font-size:13px;color:#555}

#qrBox{
  display:none;
  text-align:center;
  margin-top:16px;
}
#qrBox img{width:220px;height:220px}
</style>
</head>

<body>

<div class="card">
  <div class="poster"><img id="img"></div>
  <div class="c">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div class="small" id="dt"></div>
    <p id="desc"></p>

    <!-- 🔥 REAL PAYMENT BUTTON -->
    <a id="payBtn" class="btn">Pay via UPI</a>

    <div id="qrBox">
      <img id="qrImg">
      <div class="small">Scan & Pay using any UPI App</div>
    </div>

    <div class="small" style="margin-top:10px">Powered by PayMoney</div>
  </div>
</div>

<script>
const d = JSON.parse(sessionStorage.getItem("paymoneyData") || "{}");

const upiLink = d.pay || 
  "upi://pay?pa=paykaro@upi&pn=PayKaro&am=99&cu=INR&tn=aaa";

// bind data
if(d.poster) img.src = d.poster;
brand.innerText = d.brand || "PayMoney";
title.innerText = d.title || "";
dt.innerText = d.dt || "";
desc.innerText = d.desc || "";

// IMPORTANT PART
const isMobile = /Android|iPhone|iPad/i.test(navigator.userAgent);

if (isMobile) {
  // 📱 MOBILE → REAL UPI OPEN (only reliable way)
  payBtn.href = upiLink;
} else {
  // 💻 DESKTOP → QR
  payBtn.href = "#";
  payBtn.onclick = () => {
    const qrUrl =
      "https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=" +
      encodeURIComponent(upiLink);
    qrImg.src = qrUrl;
    qrBox.style.display = "block";
  };
}
</script>

</body>
</html>
