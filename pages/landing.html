<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  background:#f5f7fb;
  margin:0;
}
.card{
  max-width:420px;
  margin:30px auto;
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 15px 40px rgba(0,0,0,.1);
}
.poster{
  aspect-ratio:2/3;
  overflow:hidden;
}
.poster img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.c{padding:16px;}
.btn{
  margin-top:14px;
  padding:14px;
  background:#0D3B66;
  color:#fff;
  text-align:center;
  border-radius:12px;
  font-weight:600;
  cursor:pointer;
}
.small{font-size:13px;color:#666;text-align:center;margin-top:8px;}
</style>
</head>

<body>

<div class="card">
  <div class="poster" id="poster"></div>
  <div class="c">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div id="dt"></div>
    <p id="desc"></p>

    <div class="btn" id="payBtn">Pay Money</div>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const id = params.get("id");
const data = JSON.parse(localStorage.getItem("paymoney_" + id));

if(!data){
  document.body.innerHTML = "Invalid or expired link";
}else{
  poster.innerHTML = `<img src="${data.poster}">`;
  brand.innerText = data.brand;
  title.innerText = data.title;
  dt.innerText = data.datetime;
  desc.innerText = data.desc;

  payBtn.onclick = () => {
    if(data.paymentLink){
      window.location.href = data.paymentLink;
    }else{
      alert("Payment link not provided");
    }
  };
}
</script>

</body>
</html>
