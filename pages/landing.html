<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Payment Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background:#f1f5f9;
  margin:0;
}
.wrapper{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.card{
  width:100%;
  max-width:420px;
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 12px 30px rgba(0,0,0,.15);
}
.poster img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}
.content{
  padding:20px;
}
.brand{
  font-weight:600;
  color:#0D3B66;
}
.title{
  font-size:20px;
  margin:6px 0;
}
.datetime{
  font-size:14px;
  color:#555;
}
.desc{
  margin:12px 0;
  font-size:14px;
}
.price{
  font-size:26px;
  font-weight:700;
  margin:14px 0;
}
.pay{
  display:block;
  width:100%;
  text-align:center;
  padding:16px;
  background:#0D3B66;
  color:#fff;
  border-radius:12px;
  text-decoration:none;
  font-weight:600;
}
.actions{
  margin-top:14px;
  display:flex;
  gap:10px;
}
.actions button{
  flex:1;
  padding:10px;
  border-radius:8px;
  border:1px solid #ccc;
  cursor:pointer;
}
.footer{
  text-align:center;
  font-size:12px;
  color:#777;
  margin-top:12px;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="card">

    <!-- POSTER -->
    <div class="poster" id="poster"></div>

    <!-- CONTENT -->
    <div class="content">
      <div class="brand" id="brand"></div>
      <div class="title" id="title"></div>
      <div class="datetime" id="datetime"></div>
      <div class="desc" id="desc"></div>
      <div class="price" id="price"></div>

      <!-- PAY BUTTON -->
      <a href="#" id="payBtn" class="pay">Pay Money</a>

      <!-- ACTIONS -->
      <div class="actions">
        <button onclick="copyLink()">Copy Link</button>
        <button onclick="shareLink()">Share</button>
      </div>

      <div class="footer">Powered by PayMoney</div>
    </div>

  </div>
</div>

<script>
/* -------- READ LANDING DATA -------- */
const params = new URLSearchParams(window.location.search);
const id = params.get("id");

const all = JSON.parse(localStorage.getItem("paymoneyLandings") || "{}");
const d = all[id];

if(!d){
  document.body.innerHTML =
    "<h2 style='text-align:center;margin-top:40px'>Invalid or expired landing page</h2>";
  throw new Error("Invalid landing ID");
}

/* -------- FILL DATA -------- */
document.getElementById("brand").innerText = d.brand || "";
document.getElementById("title").innerText = d.title || "";
document.getElementById("datetime").innerText = d.datetime || "";
document.getElementById("desc").innerText = d.desc || "";
document.getElementById("price").innerText = d.price ? "₹ " + d.price : "";

/* POSTER */
if(d.poster){
  document.getElementById("poster").innerHTML =
    '<img src="'+ d.poster +'">';
}

/* -------- PAY MONEY CLICK (UPI SAFE) -------- */
const paymentLink = d.paymentLink;

document.getElementById("payBtn").addEventListener("click", function(e){
  e.preventDefault();
  window.location.href = paymentLink;
});

/* -------- COPY / SHARE -------- */
function copyLink(){
  navigator.clipboard.writeText(location.href);
  alert("Landing page link copied");
}
function shareLink(){
  window.open(
    "https://wa.me/?text=" + encodeURIComponent(location.href),
    "_blank"
  );
}
</script>

</body>
</html>
