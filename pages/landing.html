<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PayMoney</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.card{max-width:420px;margin:40px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.1)}
.poster{aspect-ratio:2/3}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.btn{margin-top:14px;padding:14px;background:#0D3B66;color:#fff;text-align:center;border-radius:12px;cursor:pointer}
.small{font-size:13px;color:#555}
</style>
</head>

<body>

<div class="card">
  <div class="poster"><img id="img"></div>
  <div class="c">
    <b id="brand"></b>
    <h3 id="title"></h3>
    <div class="small" id="dt"></div>
    <p id="desc"></p>
   <a id="payBtn"
   href="#"
   class="btn"
   style="display:block;text-decoration:none;">
   Pay Money
</a>

    <div class="small">Powered by PayMoney</div>
  </div>
</div>

<script>
const d = JSON.parse(sessionStorage.getItem("paymoneyData") || "{}");

img.src = d.poster;
brand.innerText = d.brand;
title.innerText = d.title;
dt.innerText = d.dt;
desc.innerText = d.desc;
payBtn.onclick = ()=> location.href = d.pay;
</script>
<script>
const params = new URLSearchParams(window.location.search);
const id = params.get("id");
const all = JSON.parse(localStorage.getItem("paymoneyLandings") || "{}");
const data = all[id];

document.getElementById("payBtn").onclick = function(e){
  e.preventDefault();

  // Try direct UPI
  window.location.href = data.paymentLink;

  // Fallback → WhatsApp
  setTimeout(() => {
    const msg = encodeURIComponent(
      "UPI app open nahi hui.\nIs link ko open kare:\n" +
      data.paymentLink
    );
    window.location.href = "https://wa.me/?text=" + msg;
  }, 1500);
};
</script>

</body>
</html>
