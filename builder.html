<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Landing Page Builder</title>

<style>
/* ===== RESET ===== */
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:system-ui,-apple-system,Segoe UI,Roboto;
  background:#f1f5f9;
  color:#0f172a;
}

/* ===== LAYOUT (MOBILE FIRST) ===== */
.page-wrap{
  display:flex;
  flex-direction:column;     /* mobile: stack */
  gap:16px;
  padding:12px;
}

.left,.right{width:100%}

/* ===== BUILDER ===== */
.left{
  background:#fff;
  border-radius:16px;
  padding:16px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.left h3{margin-bottom:10px}
.left input{
  width:100%;
  padding:12px;
  margin:8px 0;
  border-radius:10px;
  border:1px solid #cbd5e1;
}

/* ===== PREVIEW ===== */
#preview{
  width:100%;
  height:560px;
  border:none;
  border-radius:20px;
  background:#fff;
  box-shadow:0 20px 40px rgba(0,0,0,.12);
}

/* ===== DESKTOP ===== */
@media (min-width: 900px){
  .page-wrap{
    flex-direction:row;      /* desktop: side-by-side */
    align-items:flex-start;
  }
  .left,.right{flex:1}
  .right{
    position:sticky;
    top:16px;
  }
}
</style>
</head>

<body>

<div class="page-wrap">

  <!-- BUILDER -->
  <div class="left">
    <h3>Create Landing Page</h3>

    <input id="title" placeholder="Title">
    <input id="desc" placeholder="Description">
    <input id="amount" placeholder="Amount">
    <input id="upi" placeholder="UPI ID">

    <!-- IMAGE UPLOAD (GALLERY) -->
    <input type="file" id="imageFile" accept="image/*">
  </div>

  <!-- PREVIEW -->
  <div class="right">
    <iframe id="preview"></iframe>
  </div>

</div>

<script>
/* ===== LIVE PREVIEW (NO BACKEND) ===== */
const iframe = document.getElementById('preview');

function updatePreview(data){
  const q = new URLSearchParams(data).toString();
  iframe.src = 'lp.html?' + q;
}

/* Text fields → preview */
['title','desc','amount','upi'].forEach(id=>{
  document.getElementById(id).addEventListener('input', ()=>{
    updatePreview({
      title: title.value,
      desc: desc.value,
      amount: amount.value,
      upi: upi.value
    });
  });
});

/* Image upload → preview (base64, temporary) */
document.getElementById('imageFile').addEventListener('change', e=>{
  const file = e.target.files[0];
  if(!file) return;

  const reader = new FileReader();
  reader.onload = ()=>{
    updatePreview({
      title: title.value,
      desc: desc.value,
      amount: amount.value,
      upi: upi.value,
      image: reader.result   // temporary preview
    });
  };
  reader.readAsDataURL(file);
});
</script>

</body>
</html>
