<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Create Link</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{margin:0;background:#f5f7fb}
.container{max-width:560px;margin:30px auto;background:#fff;padding:24px;border-radius:16px;box-shadow:0 20px 40px rgba(0,0,0,.08)}
h1{margin:0 0 14px}
label{display:block;margin-top:14px;font-weight:600}
input,textarea{width:100%;padding:12px;margin-top:6px;border-radius:10px;border:1px solid #dbe1ea}
small{color:#64748b}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#4f46e5;color:#fff;font-weight:800;cursor:pointer}
</style>
</head>
<body>

<div class="container">
<h1>Create Payment Link</h1>

<label>Title *</label>
<input id="title">

<label>Description *</label>
<textarea id="desc"></textarea>

<label>Amount (₹) *</label>
<input id="amount" type="number">

<label>UPI ID *</label>
<input id="upi">

<label>Theme Color</label>
<input id="color" type="color" value="#4f46e5">

<label>Upload Poster Image</label>
<input type="file" id="imageFile" accept="image/*">
<small>1080×1080 or 1080×1920</small>

<label>What you’ll learn (comma separated)</label>
<input id="points">

<label>Instructor / Seller Name</label>
<input id="seller">

<label>WhatsApp Number</label>
<input id="whatsapp">

<label>WhatsApp Group Link</label>
<input id="group">

<!-- ✅ INLINE onclick (MOST STABLE) -->
<button type="button" onclick="createLink()">Create Link</button>

</div>

<!-- ✅ JS MUST BE AT BOTTOM -->
<script src="/main.js"></script>
</body>
</html>
