<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Create Landing Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
/* ===== RESET ===== */
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}

/* ===== PAGE ===== */
body{
  background:#f1f5f9;
  color:#0f172a;
}

/* ===== LAYOUT ===== */
.page{
  display:flex;
  flex-direction:column;
  gap:20px;
  padding:16px;
}

.left,.right{width:100%}

/* ===== BUILDER ===== */
.left{
  background:#fff;
  padding:20px;
  border-radius:20px;
  box-shadow:0 12px 30px rgba(0,0,0,.08);
}

.left h2{
  margin-bottom:16px;
}

.left input{
  width:100%;
  padding:14px;
  margin-bottom:12px;
  border-radius:10px;
  border:1px solid #cbd5e1;
  font-size:15px;
}

/* ===== BUTTONS ===== */
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:999px;
  font-weight:700;
  cursor:pointer;
  margin-top:8px;
}

.copy{background:#0f172a;color:#fff}
.wa{background:#22c55e;color:#000}

/* ===== PREVIEW ===== */
.right{
  background:#fff;
  border-radius:26px;
  padding:24px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}

.preview h2{
  text-align:center;
}

.preview p{
  text-align:center;
  color:#475569;
  margin-top:6px;
}

.price{
  text-align:center;
  font-size:22px;
  font-weight:800;
  margin:14px 0;
}

.pay{
  background:#ef4444;
  color:#fff;
}

.wa-btn{
  background:#22c55e;
  color:#000;
}

.points{
  margin-top:16px;
  text-align:center;
  color:#475569;
  font-size:14px;
}

/* ===== DESKTOP ===== */
@media(min-width:900px){
  .page{
    flex-direction:row;
    max-width:1200px;
    margin:auto;
  }
  .left,.right{flex:1}
}
</style>
</head>

<body>

<div class="page">

  <!-- BUILDER -->
  <div class="left">
    <h2>Create Landing Page</h2>

    <input id="title" placeholder="3-Day Yoga Class">
    <input id="desc" placeholder="Beginner Friendly · Limited Seats">
    <input id="img" placeholder="Image URL (optional)">
    <input id="amount" placeholder="500">
    <input id="upi" placeholder="jadhav.h3@ybl">
    <input id="wa" placeholder="WhatsApp Group Link">

    <input id="link" readonly>

    <button class="btn copy" onclick="copyLink()">📋 Copy Link</button>
    <button class="btn wa" onclick="shareWA()">📲 Share on WhatsApp</button>
  </div>

  <!-- PREVIEW -->
  <div class="right preview">
    <h2 id="pTitle">3-Day Yoga Class</h2>
    <p id="pDesc">Beginner Friendly · Limited Seats</p>

    <div class="price">Entry Fee: ₹<span id="pAmount">500</span></div>

    <button class="btn pay">Pay & Join</button>
    <button class="btn wa-btn">Join WhatsApp Group</button>

    <div class="points">
      ✅ Secure UPI Payment<br>
      ✅ Instant Confirmation<br>
      ✅ Mobile Friendly
    </div>
  </div>

</div>

<script>
const title = document.getElementById("title");
const desc = document.getElementById("desc");
const img = document.getElementById("img");
const amount = document.getElementById("amount");
const upi = document.getElementById("upi");
const wa = document.getElementById("wa");
const link = document.getElementById("link");

function updatePreview(){
  pTitle.innerText = title.value || "3-Day Yoga Class";
  pDesc.innerText = desc.value || "";
  pAmount.innerText = amount.value || "0";

  const url =
    location.origin + "/landing.html?" +
    "t=" + encodeURIComponent(title.value) +
    "&d=" + encodeURIComponent(desc.value) +
    "&a=" + encodeURIComponent(amount.value) +
    "&u=" + encodeURIComponent(upi.value) +
    "&w=" + encodeURIComponent(wa.value) +
    "&i=" + encodeURIComponent(img.value);

  link.value = url;
}

[title,desc,img,amount,upi,wa].forEach(i=>{
  i.addEventListener("input", updatePreview);
});

function copyLink(){
  navigator.clipboard.writeText(link.value);
  alert("Link copied");
}

function shareWA(){
  window.open(
    "https://wa.me/?text=" + encodeURIComponent(link.value),
    "_blank"
  );
}

updatePreview();
</script>

</body>
</html>
