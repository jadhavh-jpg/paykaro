<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Cloudinary Upload Widget -->
<script src="https://widget.cloudinary.com/v2.0/global/all.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#f3f4f6}
.container{max-width:1100px;margin:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.1)}
input,button{width:100%;padding:14px;margin:8px 0;border-radius:10px;border:1px solid #cbd5e1}
button{border:none;font-weight:700;cursor:pointer}
.upload{background:#2563eb;color:#fff}
.copy{background:#111827;color:#fff}
.wa{background:#22c55e;color:#000}
.preview img{width:100%;border-radius:14px;display:none;margin-bottom:10px}
@media(min-width:900px){.container{flex-direction:row}.card{flex:1}}
</style>
</head>

<body>

<div class="container">

<!-- BUILDER -->
<div class="card">
  <h3>Create Landing Page</h3>
  <input id="title" placeholder="3-Day Yoga Class">
  <input id="desc" placeholder="Beginner Friendly · Limited Seats">
  <input id="amount" placeholder="500">
  <input id="upi" placeholder="jadhav.h3@ybl">
  <input id="wa" placeholder="WhatsApp Group Link">

  <button class="upload" onclick="uploadImage()">📷 Upload Image</button>

  <input id="finalLink" readonly placeholder="Final link">
  <button class="copy" onclick="copyLink()">📋 Copy Link</button>
  <button class="wa" onclick="shareWA()">📲 Share on WhatsApp</button>
</div>

<!-- PREVIEW -->
<div class="card preview">
  <img id="img">
  <h2 id="pt"></h2>
  <p id="pd"></p>
  <h3>₹ <span id="pa"></span></h3>
</div>

</div>

<script>
/* ===== CLOUDINARY UPLOAD (STABLE) ===== */
let imageURL = "";

function uploadImage(){
  cloudinary.openUploadWidget({
    cloudName: "ddusj34vn",
    uploadPreset: "paymoney_unsigned",
    sources: ["local","camera"],
    multiple: false
  }, function(error, result){
    if(error){
      alert("Upload failed");
      console.error(error);
      return;
    }
    if(result.event === "success"){
      imageURL = result.info.secure_url;
      img.src = imageURL;
      img.style.display = "block";
      update();
    }
  });
}

/* ===== UPDATE PREVIEW + LINK ===== */
function update(){
  pt.innerText = title.value || "";
  pd.innerText = desc.value || "";
  pa.innerText = amount.value || "";

  finalLink.value =
    location.origin + "/landing.html?" +
    "t=" + encodeURIComponent(title.value) +
    "&d=" + encodeURIComponent(desc.value) +
    "&a=" + encodeURIComponent(amount.value) +
    "&u=" + encodeURIComponent(upi.value) +
    "&w=" + encodeURIComponent(wa.value) +
    "&img=" + encodeURIComponent(imageURL);
}

[title,desc,amount,upi,wa].forEach(i=>i.addEventListener("input",update));

function copyLink(){
  navigator.clipboard.writeText(finalLink.value);
  alert("Link copied");
}
function shareWA(){
  window.open(
    "https://wa.me/?text=" + encodeURIComponent(finalLink.value),
    "_blank"
  );
}

update();
</script>

</body>
</html>
