<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PayMoney Builder</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{font-family:Arial;background:#f5f7fb;margin:0}
.wrap{max-width:1200px;margin:30px auto;display:flex;gap:20px;flex-wrap:wrap}
.box{background:#fff;border-radius:16px;padding:20px;width:48%}
label{font-weight:600;margin-top:12px;display:block}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin-top:6px}
button{margin-top:18px;width:100%;padding:14px;background:#0D3B66;color:#fff;border:none;border-radius:12px;font-weight:600;cursor:pointer}
.preview{border:1px solid #ddd;border-radius:16px;overflow:hidden}
.poster{aspect-ratio:2/3;background:#eee}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.pay{margin-top:14px;padding:14px;background:#0D3B66;color:#fff;text-align:center;border-radius:12px;opacity:.7}
.small{font-size:13px;color:#555}

/* payment link generator */
.gen{
  margin-top:20px;
  padding:14px;
  background:#f1f5f9;
  border-radius:12px;
}
.gen h3{margin:0 0 10px;font-size:16px}
.gen button{background:#2FB344}
.gen-link{
  margin-top:10px;
  font-size:13px;
  word-break:break-all;
  color:#0D3B66;
}
</style>
</head>

<body>

<div class="wrap">

<!-- LEFT SIDE -->
<div class="box">
<h2>Create Landing</h2>

<label>Brand</label>
<input id="brand" oninput="sync()">

<label>Poster Image</label>
<input type="file" accept="image/*" onchange="loadImg(event)">

<label>Title</label>
<input id="title" oninput="sync()">

<label>Date & Time</label>
<input id="dt" oninput="sync()">

<!-- 🔥 PAYMENT LINK GENERATOR -->
<div class="gen">
  <h3>Generate Payment Link</h3>

  <label>Your UPI ID</label>
  <input id="upi" placeholder="example@upi">

  <label>Amount (₹)</label>
  <input id="amt" type="number">

  <button onclick="generatePayLink()">Generate Link</button>

  <div class="gen-link" id="plink"></div>
</div>

<label>Payment Link (Auto Filled)</label>
<input id="pay">

<label>Description</label>
<textarea id="desc" oninput="sync()"></textarea>

<button onclick="generate()">Generate Landing Page</button>
</div>

<!-- RIGHT SIDE PREVIEW -->
<div class="box">
<h3>Live Preview</h3>
<div class="preview">
  <div class="poster" id="pimg"></div>
  <div class="c">
    <b id="pbrand"></b>
    <h3 id="ptitle"></h3>
    <div class="small" id="pdt"></div>
    <p id="pdesc"></p>
    <div class="pay">Pay Money</div>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>
</div>

</div>

<script>
let imageURL="";

function loadImg(e){
  const file=e.target.files[0];
  if(!file) return;
  imageURL = URL.createObjectURL(file);
  pimg.innerHTML = `<img src="${imageURL}">`;
}

function sync(){
  pbrand.innerText=brand.value;
  ptitle.innerText=title.value;
  pdt.innerText=dt.value;
  pdesc.innerText=desc.value;
}

/* 🔥 PAYMENT LINK LOGIC */
function generatePayLink(){
  const u = upi.value.trim();
  const a = amt.value;

  if(!u || u.indexOf("@")===-1){
    alert("Enter valid UPI ID");
    return;
  }
  if(!a || a<=0){
    alert("Enter valid amount");
    return;
  }

  const link =
    "upi://pay?pa="+encodeURIComponent(u)+
    "&pn=PayMoney"+
    "&am="+a+
    "&cu=INR";

  pay.value = link;        // 🔥 auto fill
  plink.innerText = link;  // show link
}

function generate(){
  if(!imageURL){
    alert("Please select image");
    return;
  }

  const data={
    brand:brand.value,
    title:title.value,
    dt:dt.value,
    desc:desc.value,
    pay:pay.value,
    poster:imageURL
  };

  sessionStorage.setItem("paymoneyData",JSON.stringify(data));
  window.open("landing.html","_blank");
}
</script>

</body>
</html>
