<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Create Payment Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
.wrap{display:flex;min-height:100vh}
.left{width:45%;padding:20px;background:#fff}
.right{width:55%;padding:20px}
input,button{width:100%;padding:10px;margin:6px 0}
button{background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:700}
iframe{width:100%;height:100%;border:none;border-radius:16px}
small{color:#64748b}
</style>
</head>

<body>
<div class="wrap">

<!-- BUILDER -->
<div class="left">
<h2>Create Landing Page</h2>

<label>Theme Color</label>
<input type="color" id="color" value="#16a34a">

<label>Title</label>
<input id="title" value="3-Day Yoga Class">

<label>Subtitle</label>
<input id="sub" value="Beginner Friendly · Limited Seats">

<label>Image URL (recommended)</label>
<input id="img" placeholder="https://example.com/image.jpg">

<small>OR YouTube Link</small>
<input id="yt" placeholder="https://youtube.com/watch?v=...">

<label>Amount (₹)</label>
<input id="amt" value="500">

<label>UPI ID</label>
<input id="upi" value="jadhav.h3@ybl">

<label>WhatsApp Group Link</label>
<input id="wa">

<button onclick="generate()">Generate Page</button>

<input id="link" readonly>
<button onclick="copy()">📋 Copy Link</button>
<button onclick="share()">📤 Share WhatsApp</button>
</div>

<!-- PREVIEW -->
<div class="right">
<iframe id="preview"></iframe>
</div>

</div>

<script>
function generate(){
  const p = new URLSearchParams({
    t:title.value,
    s:sub.value,
    img:img.value,
    yt:yt.value,
    a:amt.value,
    upi:upi.value,
    wa:wa.value,
    c:color.value.replace("#","")
  });

  const url = location.origin + "/lp.html?" + p.toString();
  link.value = url;
  preview.src = url;
}

function copy(){
  navigator.clipboard.writeText(link.value);
  alert("Link copied");
}

function share(){
  window.open("https://wa.me/?text=" + encodeURIComponent(link.value));
}
</script>

</body>
</html>
