<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney24 – Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}

/* MAIN LAYOUT */
.wrap{
  display:flex;
  min-height:100vh;
}

/* LEFT */
.left{
  width:40%;
  padding:20px;
  background:#fff;
}

/* RIGHT */
.right{
  width:60%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

h2{margin-top:0}
input{width:100%;padding:10px;margin-bottom:10px}
button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:700;margin-top:8px;cursor:pointer}
.copy{background:#0f172a;color:#fff}
.wa{background:#22c55e}

iframe{
  width:100%;
  max-width:420px;
  height:720px;
  border:none;
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}

/* 🔥 MOBILE FIX */
@media(max-width:768px){
  .wrap{flex-direction:column}
  .left,.right{width:100%}
}
</style>
</head>

<body>

<div class="wrap">

  <div class="left">
    <h2>Create Landing Page</h2>

    <input id="t" value="3-Day Yoga Class">
    <input id="s" value="Beginner Friendly · Limited Seats">
    <input id="img" placeholder="Image URL">
    <input id="a" value="500">
    <input id="upi" value="jadhav.h3@ybl">
    <input id="wa" placeholder="WhatsApp Group Link">

    <input id="linkBox" readonly>

    <button class="copy" onclick="copyLink()">📋 Copy Link</button>
    <button class="wa" onclick="shareWA()">📤 Share on WhatsApp</button>
  </div>

  <div class="right">
    <iframe id="preview"></iframe>
  </div>

</div>

<script>
const tEl=t,sEl=s,imgEl=img,aEl=a,upiEl=upi,waEl=wa;

function update(){
  const url =
    location.origin + "/landing.html"
    + "?t=" + encodeURIComponent(tEl.value)
    + "&s=" + encodeURIComponent(sEl.value)
    + "&img=" + encodeURIComponent(imgEl.value)
    + "&a=" + aEl.value
    + "&upi=" + encodeURIComponent(upiEl.value)
    + "&wa=" + encodeURIComponent(waEl.value);

  preview.src = url;
  linkBox.value = url;
}

[tEl,sEl,imgEl,aEl,upiEl,waEl].forEach(i=>i.addEventListener("input",update));
update();

function copyLink(){
  navigator.clipboard.writeText(linkBox.value);
  alert("Link copied");
}
function shareWA(){
  window.open("https://wa.me/?text="+encodeURIComponent(linkBox.value));
}
</script>

</body>
</html>
