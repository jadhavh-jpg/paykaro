<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney24 Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
.wrap{display:flex;min-height:100vh}
.left{width:50%;padding:20px;background:#fff}
.right{width:50%;display:flex;justify-content:center;align-items:center}
input,button{width:100%;padding:10px;margin:6px 0}
button{border:none;border-radius:6px;background:#2563eb;color:#fff;font-weight:700;cursor:pointer}
iframe{width:390px;height:720px;border-radius:24px;border:none;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.small{font-size:12px;color:#64748b}
</style>
</head>

<body>
<div class="wrap">

<div class="left">
<h2>Create Landing Page</h2>

<input id="title" placeholder="Title" value="3-Day Yoga Class">
<input id="sub" placeholder="Subtitle" value="Beginner Friendly · Limited Seats">
<input id="img" placeholder="Image URL (https://...)">
<input id="amt" placeholder="Amount ₹" value="500">
<input id="upi" placeholder="UPI ID" value="jadhav.h3@ybl">
<input id="wa" placeholder="WhatsApp Group Link">

<button onclick="generate()">Generate Preview</button>

<input id="finalLink" readonly>
<button onclick="copy()">Copy Link</button>
<button onclick="share()">Share WhatsApp</button>

<p class="small">✔ Image URL only (no upload) → no long links</p>
</div>

<div class="right">
<iframe id="preview"></iframe>
</div>

</div>

<script>
function generate(){
  const t = encodeURIComponent(title.value);
  const s = encodeURIComponent(sub.value);
  const img = encodeURIComponent(imgUrl());
  const a = amt.value;
  const u = encodeURIComponent(upi.value);
  const w = encodeURIComponent(wa.value);

  const url = `${location.origin}/index.html?t=${t}&s=${s}&img=${img}&a=${a}&upi=${u}&wa=${w}`;

  preview.src = url;
  finalLink.value = url;
}

function imgUrl(){
  return img.value.startsWith("http") ? img.value : "";
}

function copy(){
  navigator.clipboard.writeText(finalLink.value);
  alert("Link copied");
}

function share(){
  window.open("https://wa.me/?text="+encodeURIComponent(finalLink.value));
}
</script>
</body>
</html>
