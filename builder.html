<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pay & Join</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:system-ui;background:#f8fafc}
.card{
  max-width:420px;
  margin:30px auto;
  background:#fff;
  padding:20px;
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}
.hero{text-align:center}
.hero h2{margin:0}
.hero p{color:#475569;margin:6px 0 0}

img{
  width:100%;
  border-radius:16px;
  margin:16px 0;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:999px;
  font-weight:700;
  margin-top:10px;
  cursor:pointer;
}
.pay{background:#ef4444;color:#fff}
.wa{background:#22c55e}

.qr{
  display:none;
  text-align:center;
  margin-top:14px;
}
.qr img{width:260px}

small{color:#64748b}
</style>
</head>

<body>

<div class="card">
  <div class="hero">
    <h2 id="title"></h2>
    <p id="subtitle"></p>
  </div>

  <img id="heroImg" style="display:none">

  <h3 id="price"></h3>

  <button class="btn pay" onclick="pay()">Pay & Join</button>
  <button class="btn wa" onclick="joinWA()">Join WhatsApp Group</button>

  <div class="qr" id="qrBox">
    <p>Scan & Pay</p>
    <img id="qrImg">
  </div>

  <small>
    ✅ Secure UPI Payment<br>
    ✅ Instant Confirmation<br>
    ✅ Mobile Friendly
  </small>
</div>

<script>
const params = new URLSearchParams(location.search);

title.innerText = params.get("t") || "";
subtitle.innerText = params.get("s") || "";
price.innerText = "Entry Fee: ₹" + (params.get("a") || "0");

const imgUrl = params.get("img");
if(imgUrl && imgUrl.startsWith("http")){
  heroImg.src = imgUrl;
  heroImg.style.display = "block";
}

function pay(){
  const upi =
    "upi://pay?pa=" + params.get("upi")
    + "&pn=PayMoney24"
    + "&am=" + params.get("a")
    + "&cu=INR";

  // Mobile → direct QR (safe)
  qrImg.src =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data="
    + encodeURIComponent(upi);

  qrBox.style.display = "block";
  qrBox.scrollIntoView({behavior:"smooth"});
}

function joinWA(){
  const wa = params.get("wa");
  if(wa) window.open(wa,"_blank");
}
</script>

</body>
</html>
