<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PayMoney – Landing Builder</title>
<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0}
.wrap{max-width:1000px;margin:20px auto;padding:0 14px}
.box{background:#fff;border-radius:16px;padding:20px;margin-bottom:20px}
h2,h3{margin-top:0}

label{font-weight:600;margin-top:14px;display:block}
input,textarea{
  width:100%;padding:12px;border-radius:8px;
  border:1px solid #ccc;margin-top:6px;font-size:15px
}
textarea{min-height:90px}

button{
  margin-top:18px;width:100%;padding:14px;
  background:#0D3B66;color:#fff;border:none;
  border-radius:12px;font-weight:600;
  font-size:16px;cursor:pointer
}

/* preview */
.preview{border:1px solid #ddd;border-radius:16px;overflow:hidden}
.poster{aspect-ratio:2/3;background:#eee}
.poster img{width:100%;height:100%;object-fit:cover}
.c{padding:16px}
.pay{
  margin-top:14px;padding:14px;
  background:#0D3B66;color:#fff;
  text-align:center;border-radius:12px;
  opacity:.35;pointer-events:none
}
.small{font-size:13px;color:#555;margin-top:8px}

/* copy/share buttons */
.actions{display:none;margin-top:14px}
.copy-btn{
  padding:12px;background:#2FB344;color:#fff;
  border-radius:12px;text-align:center;
  font-weight:600;cursor:pointer;
  animation:pulse 2s infinite
}
.copy-btn:hover{background:#239a37}

.share-btn{
  margin-top:10px;padding:12px;
  background:#25D366;color:#fff;
  border-radius:12px;text-align:center;
  font-weight:600;cursor:pointer
}

@keyframes pulse{
  0%{box-shadow:0 0 0 0 rgba(47,179,68,.6)}
  70%{box-shadow:0 0 0 14px rgba(47,179,68,0)}
  100%{box-shadow:0 0 0 0 rgba(47,179,68,0)}
}

/* desktop */
@media(min-width:900px){
  .flex{display:flex;gap:20px}
  .half{width:50%}
}
</style>
</head>

<body>

<div class="wrap flex">

<!-- LEFT -->
<div class="box half">
<h2>Create Landing</h2>

<label>Brand</label>
<input id="brand" oninput="sync()">

<label>Poster Image</label>
<input type="file" accept="image/*" onchange="loadImg(event)">

<label>Title</label>
<input id="title" oninput="sync()">

<label>Date & Time</label>
<input type="datetime-local" id="dt" oninput="sync()">

<label>Payment Link</label>
<input id="pay" placeholder="Paste PayMoney payment link">

<label>Description</label>
<textarea id="desc" oninput="sync()"></textarea>

<button onclick="generate()">Generate Landing Page</button>

<!-- COPY & SHARE -->
<div class="actions" id="actions">
  <div class="copy-btn" onclick="copyLink()">Copy Landing Link</div>
  <div class="share-btn" onclick="shareWA()">Share on WhatsApp</div>
</div>
</div>

<!-- RIGHT -->
<div class="box half">
<h3>Live Preview</h3>

<div class="preview">
  <div class="poster" id="pimg"></div>
  <div class="c">
    <b id="pbrand"></b>
    <h3 id="ptitle"></h3>
    <div class="small" id="pdt"></div>
    <p id="pdesc"></p>
    <div class="pay">Pay Now (Disabled)</div>
    <div class="small">Powered by PayMoney</div>
  </div>
</div>
</div>

</div>

<script>
let imageURL="";
let landingURL="";

function loadImg(e){
  const file=e.target.files[0];
  if(!file) return;
  imageURL=URL.createObjectURL(file);
  pimg.innerHTML=`<img src="${imageURL}">`;
}

function sync(){
  pbrand.innerText=brand.value;
  ptitle.innerText=title.value;
  pdt.innerText=dt.value;
  pdesc.innerText=desc.value;
}

function generate(){
  if(!imageURL){alert("Select image");return}
  if(!pay.value){alert("Paste payment link");return}

  const data={
    brand:brand.value,
    title:title.value,
    dt:dt.value,
    desc:desc.value,
    pay:pay.value,
    poster:imageURL
  };

  sessionStorage.setItem("paymoneyData",JSON.stringify(data));

  landingURL = location.origin + "/landing.html";
  actions.style.display="block";
}

function copyLink(){
  navigator.clipboard.writeText(landingURL);
  alert("Landing link copied");
}

function shareWA(){
  const txt = encodeURIComponent("Pay securely via PayMoney\n"+landingURL);
  window.open("https://wa.me/?text="+txt,"_blank");
}
</script>

</body>
</html>
