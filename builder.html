<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney24 – Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:system-ui;background:#f1f5f9}
.wrap{display:flex;min-height:100vh}
.left{width:40%;padding:20px;background:#fff}
.right{width:60%;display:flex;align-items:center;justify-content:center}

h2{margin-top:0}
input{width:100%;padding:10px;margin-bottom:10px}
button{width:100%;padding:12px;border:none;border-radius:8px;font-weight:700;margin-top:8px;cursor:pointer}
.copy{background:#0f172a;color:#fff}
.wa{background:#22c55e}

iframe{
  width:420px;
  height:720px;
  border:none;
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,.2);
}
</style>
</head>

<body>

<div class="wrap">

  <!-- BUILDER -->
  <div class="left">
    <h2>Create Landing Page</h2>

    <input id="t" placeholder="Title" value="3-Day Yoga Class">
    <input id="s" placeholder="Subtitle" value="Beginner Friendly · Limited Seats">
    <input id="img" placeholder="Image URL (https://...)">
    <input id="a" placeholder="Amount" value="500">
    <input id="upi" placeholder="UPI ID" value="jadhav.h3@ybl">
    <input id="wa" placeholder="WhatsApp Group Link">

    <input id="linkBox" readonly>

    <button class="copy" onclick="copyLink()">📋 Copy Link</button>
    <button class="wa" onclick="shareWA()">📤 Share on WhatsApp</button>
  </div>

  <!-- LIVE PREVIEW -->
  <div class="right">
    <iframe id="preview"></iframe>
  </div>
<div class="wrapper">

  <div class="builder">
    <!-- LEFT FORM -->
  </div>

  <div class="preview">
    <!-- RIGHT PREVIEW CARD / iframe -->
  </div>

</div>
<script>
function update(){
  const t = tEl.value;
  const s = sEl.value;
  const img = imgEl.value;
  const a = aEl.value;
  const upi = upiEl.value;
  const wa = waEl.value;

  const url =
    location.origin + "/landing.html"
    + "?t=" + encodeURIComponent(t)
    + "&s=" + encodeURIComponent(s)
    + "&img=" + encodeURIComponent(img)
    + "&a=" + a
    + "&upi=" + encodeURIComponent(upi)
    + "&wa=" + encodeURIComponent(wa);

  preview.src = url;
  linkBox.value = url;
}

function copyLink(){
  navigator.clipboard.writeText(linkBox.value);
  alert("Link copied");
}
function shareWA(){
  window.open("https://wa.me/?text="+encodeURIComponent(linkBox.value));
}

const tEl=t,sEl=s,imgEl=img,aEl=a,upiEl=upi,waEl=wa;
[tEl,sEl,imgEl,aEl,upiEl,waEl].forEach(i=>i.addEventListener("input",update));

update();
  /* MAIN LAYOUT FIX */
.wrapper{
  display:flex;
  min-height:100vh;
  background:#f8fafc;
}

/* LEFT BUILDER */
.builder{
  width:38%;
  padding:16px;
  overflow-y:auto;
}

/* RIGHT PREVIEW */
.preview{
  width:62%;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

/* PREVIEW CARD */
.preview iframe,
.preview .card{
  width:100%;
  max-width:420px;
}

/* 🔥 MOBILE FIX */
@media (max-width:768px){
  .wrapper{
    flex-direction:column;
  }

  .builder,
  .preview{
    width:100%;
  }

  .preview{
    padding:12px;
  }
}

</script>

</body>
</html>
