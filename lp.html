<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{ --theme:#4f46e5; }
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{margin:0;background:#f5f7fb;color:#0f172a}

.container{max-width:760px;margin:20px auto;padding:14px}
.card{
  background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;
  box-shadow:0 14px 30px rgba(0,0,0,.08)
}

h1{margin:0 0 8px;font-size:26px}
p{color:#475569;line-height:1.6}

.hero img{
  width:100%;
  max-width:100%;
  border-radius:14px;
  display:block;
}

.cta{
  display:block;
  width:100%;
  margin-top:14px;
  padding:14px;
  border-radius:12px;
  background:var(--theme);
  color:#fff;
  font-weight:800;
  border:none;
  font-size:16px;
}

.hide{display:none}

.actions a{
  display:block;
  margin:8px 0;
  padding:12px;
  border-radius:10px;
  background:#f1f5f9;
  text-align:center;
  font-weight:700;
  text-decoration:none;
  color:#000;
}

#qr{margin:14px auto;display:block}

.bottom{
  position:sticky;
  bottom:0;
  background:#fff;
  padding:12px;
  border-top:1px solid #e5e7eb;
}
.bottom button{
  width:100%;
  margin:6px 0;
  padding:12px;
  border-radius:10px;
  border:none;
  font-weight:700;
}
</style>
</head>
<body>

<div class="container">

  <!-- HERO -->
  <div class="card">
    <h1 id="title"></h1>
    <p id="desc"></p>
    <img id="poster" class="hide" loading="lazy">
  </div>

  <!-- PAYMENT -->
  <div class="card" id="pay">
    <h2>Pay ₹<span id="amount"></span></h2>

    <button class="cta" id="upiBtn">Open UPI App</button>

    <canvas id="qr" class="hide"></canvas>

    <p id="upiError" class="hide" style="color:#dc2626;font-weight:600;text-align:center">
      UPI app not supported on this device.<br>
      Please pay by scanning the QR code.
    </p>

    <div class="actions">
      <a id="waBtn" class="hide">WhatsApp</a>
      <a id="groupBtn" class="hide">Join WhatsApp Group</a>
    </div>
  </div>

</div>

<!-- BOTTOM SHARE -->
<div class="bottom">
  <button onclick="copyLink()">Copy Payment Link</button>
  <button onclick="shareWhatsApp()">Share on WhatsApp</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script>
const q = new URLSearchParams(location.search);

// THEME
if(q.get('color')){
  document.documentElement.style.setProperty('--theme', q.get('color'));
}

// BASIC
title.innerText = q.get('title') || '';
desc.innerText = q.get('desc') || '';
amount.innerText = q.get('amount') || '';

// IMAGE (CLOUDINARY URL)
if(q.get('image')){
  poster.src = q.get('image');
  poster.classList.remove('hide');
}

// UPI + QR
const upiURL =
  `upi://pay?pa=${q.get('upi')}&pn=${encodeURIComponent(q.get('title'))}&am=${q.get('amount')}&cu=INR`;

QRCode.toCanvas(qr, upiURL, { width: 220 });

upiBtn.onclick = ()=>{
  window.location.href = upiURL;
  qr.classList.remove('hide');
  upiError.classList.remove('hide');
};

// WhatsApp buttons
if(q.get('whatsapp')){
  waBtn.href = "https://wa.me/" + q.get('whatsapp');
  waBtn.classList.remove('hide');
}
if(q.get('group')){
  groupBtn.href = q.get('group');
  groupBtn.classList.remove('hide');
}

// COPY / SHARE
function copyLink(){
  navigator.clipboard.writeText(location.href);
  alert("Payment link copied");
}
function shareWhatsApp(){
  window.open("https://wa.me/?text=" + encodeURIComponent(location.href));
}
</script>

</body>
</html>
