<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Secure Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{--theme:#4f46e5}
*{box-sizing:border-box;font-family:Inter,system-ui}
body{margin:0;background:#f5f7fb}
.container{max-width:900px;margin:30px auto;padding:20px}
.card{background:#fff;border-radius:16px;padding:24px;margin-bottom:20px;box-shadow:0 20px 40px rgba(0,0,0,.08)}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}
.hero img{width:100%;border-radius:14px}
.cta{display:inline-block;padding:14px 26px;border-radius:12px;background:linear-gradient(135deg,var(--theme),#000);color:#fff;font-weight:800;text-decoration:none}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.box{background:#f8fafc;padding:14px;border-radius:12px}
.hide{display:none}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="container">

<div class="card hero">
<div>
<h1 id="title"></h1>
<p id="desc"></p>
<p><strong id="seller"></strong></p>
<a href="#pay" class="cta">Proceed to Pay</a>
</div>
<img id="poster" class="hide">
</div>

<div class="card">
<h2>What you’ll get</h2>
<div class="grid" id="pointsBox"></div>
</div>

<div class="card" id="pay">
<h2>Pay ₹<span id="amount"></span></h2>
<a id="upiBtn" class="cta">Open UPI App</a>
<canvas id="qr" class="hide"></canvas>
<p id="upiError" class="hide" style="color:#dc2626;font-weight:600">
UPI app not supported on this device.<br>
Please pay by scanning the QR code.
</p>

<div style="margin-top:12px">
<a id="waBtn" class="hide">WhatsApp</a> |
<a id="groupBtn" class="hide">Join WhatsApp Group</a>
</div>
</div>

<p style="text-align:center;color:#64748b;font-size:12px">Powered by PayMoney</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
<script src="/main.js"></script>
<script src="/qr.js"></script>
</body>
</html>
