<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PayMoney – Secure Payment</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
:root{ --theme:#4f46e5; }
*{box-sizing:border-box;font-family:Inter,system-ui,Arial}
body{margin:0;background:#f5f7fb;color:#0f172a}
.container{max-width:900px;margin:40px auto;padding:20px}
.card{
  background:#fff;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.08)
}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px}
.hero img{width:100%;border-radius:14px}
.badge{
  display:inline-block;
  background:#eef2ff;
  color:var(--theme);
  padding:6px 14px;
  border-radius:999px;
  font-size:12px;
  font-weight:700
}
h1{margin:10px 0;font-size:28px}
p{color:#475569;line-height:1.6}
.cta{
  display:inline-block;
  margin-top:16px;
  padding:14px 26px;
  border-radius:12px;
  background:linear-gradient(135deg,var(--theme),#000);
  color:#fff;
  font-weight:800;
  text-decoration:none
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.box{background:#f8fafc;padding:16px;border-radius:12px;text-align:center}
.video iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:14px}
.paybox{text-align:center}
.actions a{
  display:inline-block;
  margin:8px;
  padding:12px 18px;
  border-radius:10px;
  background:#f1f5f9;
  color:#000;
  font-weight:700;
  text-decoration:none
}
.hide{display:none}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="container">

  <!-- 1. HERO -->
  <div class="card hero">
    <div>
      <span class="badge">Secure UPI Payment</span>
      <h1 id="title"></h1>
      <p id="desc"></p>
      <a href="#pay" class="cta">Pay Now</a>
    </div>
    <img id="poster" class="hide">
  </div>

  <!-- 2. SOLUTION -->
  <div class="card">
    <h2>Why Pay Here?</h2>
    <div class="grid">
      <div class="box">Instant UPI Payment</div>
      <div class="box">No Gateway Charges</div>
      <div class="box">100% Secure</div>
    </div>
  </div>

  <!-- 3. VIDEO -->
  <div class="card video hide" id="videoBox">
    <h2>Watch Details</h2>
    <iframe id="videoFrame"></iframe>
  </div>

  <!-- 4. PAYMENT -->
  <div class="card paybox" id="pay">
    <h2>Pay ₹<span id="amount"></span></h2>

    <a id="upiBtn" class="cta hide">Open UPI App</a>
    <canvas id="qr" class="hide"></canvas>
    <p id="qrNote" class="hide">Scan QR using any UPI app</p>

    <div class="actions">
      <a id="waBtn" class="hide">WhatsApp</a>
      <a id="groupBtn" class="hide">Join WhatsApp Group</a>
    </div>
  </div>

  <div style="text-align:center;font-size:12px;color:#64748b">
    © PayMoney · Secure Payments
  </div>

</div>

<!-- QR Library -->
<script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>

<!-- MAIN LOGIC -->
<script src="/main.js"></script>

<!-- QR LOGIC -->
<script src="/qr.js"></script>

</body>
</html>
