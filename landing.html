<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pay & Join – PayMoney24</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;font-family:system-ui,-apple-system,Segoe UI}
body{
  margin:0;
  background:#f8fafc;
}
.card{
  max-width:420px;
  margin:30px auto;
  background:#ffffff;
  padding:20px;
  border-radius:24px;
  box-shadow:0 20px 40px rgba(0,0,0,.15);
}
.hero{
  text-align:center;
}
.hero h2{
  margin:0;
  font-size:22px;
}
.hero p{
  margin:6px 0 0;
  color:#475569;
  font-size:14px;
}
#heroImg{
  width:100%;
  border-radius:16px;
  margin:16px 0;
  display:none;
}
.price{
  font-size:20px;
  font-weight:800;
  margin:10px 0;
  text-align:center;
}
.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:999px;
  font-weight:700;
  font-size:16px;
  cursor:pointer;
  margin-top:10px;
}
.pay{
  background:#ef4444;
  color:#fff;
}
.wa{
  background:#22c55e;
  color:#000;
}
.qr{
  display:none;
  text-align:center;
  margin-top:14px;
}
.qr img{
  width:260px;
}
.features{
  margin-top:14px;
  font-size:13px;
  color:#475569;
  text-align:center;
}
</style>
</head>

<body>

<div class="card">
<img id="heroImg" style="width:100%;border-radius:16px;display:none">

  <div class="hero">
    <h2 id="title"></h2>
    <p id="subtitle"></p>
  </div>

  <img id="heroImg" alt="Program Image">

  <div class="price" id="price"></div>

  <button class="btn pay" onclick="payNow()">Pay & Join</button>
  <button class="btn wa" onclick="joinWA()">Join WhatsApp Group</button>

  <div class="qr" id="qrBox">
    <p>Scan & Pay</p>
    <img id="qrImg">
  </div>

  <div class="features">
    ✅ Secure UPI Payment<br>
    ✅ Instant Confirmation<br>
    ✅ Mobile Friendly
  </div>

</div>

<script>
const params = new URLSearchParams(window.location.search);

const title = params.get("t") || "";
const subtitle = params.get("s") || "";
const amount = params.get("a") || "0";
const upi = params.get("upi") || "";
const wa = params.get("wa") || "";
const imgUrl = params.get("img") || "";

document.getElementById("title").innerText = title;
document.getElementById("subtitle").innerText = subtitle;
document.getElementById("price").innerText = "Entry Fee: ₹" + amount;

// image safe load
if(imgUrl.startsWith("http")){
  const img = document.getElementById("heroImg");
  img.src = imgUrl;
  img.style.display = "block";
}

// Pay logic → QR (safe on all devices)
function payNow(){
  if(!upi){
    alert("UPI ID missing");
    return;
  }
  const upiLink =
    "upi://pay?pa=" + encodeURIComponent(upi) +
    "&pn=PayMoney24" +
    "&am=" + encodeURIComponent(amount) +
    "&cu=INR";

  const qr =
    "https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=" +
    encodeURIComponent(upiLink);

  document.getElementById("qrImg").src = qr;
  document.getElementById("qrBox").style.display = "block";
  document.getElementById("qrBox").scrollIntoView({behavior:"smooth"});
}

function joinWA(){
  if(wa){
    window.open(wa,"_blank");
  }else{
    alert("WhatsApp group link not available");
  }
}
  const img = new URLSearchParams(location.search).get("img");
if(img){
  heroImg.src = img;
  heroImg.style.display = "block";
}

</script>

</body>
</html>
